# Overrides applied on Cloudflare Pages PREVIEW builds only
# (loaded after hugo.toml via --config hugo.toml,config-preview.toml).
# Production (GitHub Pages from main) never uses this file.

[params]
  # No analytics on draft previews
  googleAnalytics = ''

  # Marks this as a staging surface. Turns on stage badges, the staging
  # banner, and the /pipeline/ dashboard. Production never sets this, so
  # unpublished work can never leak into the public build.
  isPreview = true
