name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned to match the local dev machine and the Cloudflare preview
          # build (HUGO_VERSION in scripts/cf-pages-build.sh). Bump all three
          # together so what you see locally is what ships. See
          # docs/working-remotely.md.
          hugo-version: '0.156.0'
          extended: true
      - name: Staging guard (block non-live pages missing draft:true)
        run: sh scripts/check-staging.sh
      - name: Build
        run: hugo --minify --baseURL "https://www.cfmcorner.com/"
      - name: Build search index
        run: npx pagefind@latest --site public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
