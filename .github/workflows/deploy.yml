name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # B1 content check (stage 3). The same pinned checker as the local pre-push hook.
  # The hook can be skipped with --no-verify; this job cannot, because build needs it.
  # Its base is the last DEPLOYED commit, which equals github.event.before in a normal
  # push; see scripts/b1/ci_content_check.sh for why and what it prints when they differ.
  content-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # Matches the local hook's interpreter (/opt/homebrew/bin/python3).
          python-version: '3.14'
      - name: Find the last deployed commit
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
                --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: B1 content check (Bible Hub, popup hosts, video sections, visible URLs)
        env:
          TREE: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          LAST: ${{ steps.last.outputs.sha }}
        run: sh scripts/b1/ci_content_check.sh "$TREE" "$BEFORE" "$LAST"

  build:
    needs: content-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.156.0'
          extended: true
      - name: Staging guard (block non-live pages missing draft:true)
        run: sh scripts/check-staging.sh
      - name: Build
        run: hugo --minify --baseURL "https://www.cfmcorner.com/"
      - name: Build search index
        run: npx pagefind@latest --site public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
