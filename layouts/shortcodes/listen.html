{{- /* "Listen to this section" audio player for the field guides.
       Usage:  {{< listen src="/audio/culture/babylon/01-the-land-between-the-rivers.mp3" >}}
       Optional: title="…"  voice="…"  note="…"
       Styled to the guide's sage/parchment palette; native <audio> for reliability + accessibility. */ -}}
{{- $src   := .Get "src" -}}
{{- $title := .Get "title" | default "Listen to this section" -}}
{{- $voice := .Get "voice" | default "Narrated in Kym&rsquo;s voice" -}}
{{- $note  := .Get "note" -}}
<div class="listen-player" style="max-width: 750px; margin: 0 auto 1.75rem auto; background: linear-gradient(135deg, #f2f5f2 0%, #dce8dd 100%); border: 1px solid #cdddce; border-radius: 14px; padding: 16px 18px; box-shadow: 0 4px 12px rgba(74,107,82,0.08);">
  <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 12px;">
    <span aria-hidden="true" style="flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #4a6b52;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f2f5f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 14v-2a9 9 0 0 1 18 0v2"></path>
        <path d="M21 15a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2z"></path>
        <path d="M3 15a2 2 0 0 0 2 2h1v-5H5a2 2 0 0 0-2 2z"></path>
      </svg>
    </span>
    <div style="flex: 1; min-width: 0;">
      <div style="font-weight: 700; color: #3c5743; font-size: 1.02em; line-height: 1.2;">{{ $title | safeHTML }}</div>
      <div style="color: #6a8470; font-size: 0.85em; margin-top: 2px;">{{ $voice | safeHTML }}</div>
    </div>
  </div>
  <audio controls preload="none" style="width: 100%; height: 40px; border-radius: 8px;">
    <source src="{{ $src }}" type="audio/mpeg">
    Your browser doesn&rsquo;t support the audio element &mdash;
    <a href="{{ $src }}">download the audio</a> instead.
  </audio>
  {{- with $note }}
  <div style="color: #6a8470; font-size: 0.8em; font-style: italic; margin-top: 8px;">{{ . | safeHTML }}</div>
  {{- end }}
</div>
