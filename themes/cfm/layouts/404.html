{{ define "main" }}
<div style="text-align: center; padding: 80px 20px;">
    <div style="font-size: 4em; opacity: 0.3; margin-bottom: 16px;">🌿</div>
    <h1 style="font-family: Georgia, serif; color: var(--sage-dark); font-weight: normal; font-size: 2em; margin-bottom: 12px;">Page Not Found</h1>
    <p style="color: var(--text-secondary); max-width: 450px; margin: 0 auto 28px; line-height: 1.7;">The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="{{ "" | relURL }}/" style="display: inline-block; background: var(--sage-dark); color: white; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600;">Go Home</a>
        <a href="{{ "weeks/" | relURL }}" style="display: inline-block; background: white; color: var(--sage-dark); border: 2px solid var(--sage-dark); padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600;">Weekly Lessons</a>
        <a href="{{ "search/" | relURL }}" style="display: inline-block; background: white; color: var(--sage-dark); border: 2px solid var(--sage-dark); padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600;">Search</a>
    </div>
</div>
{{ end }}
