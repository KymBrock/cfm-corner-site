<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

    <!-- Favicons -->
    <link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="32x32">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32x32.png" | relURL }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "favicon-16x16.png" | relURL }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "apple-touch-icon.png" | relURL }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:image" content="{{ with .Params.image }}{{ . | absURL }}{{ else }}{{ "images/tree-logo.png" | absURL }}{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
    <meta name="twitter:card" content="summary">

    <link rel="stylesheet" href="{{ (printf "css/style.css?v=%d" now.Unix) | relURL }}">
    {{ block "head" . }}{{ end }}
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="{{ "" | relURL }}/" class="nav-logo">
                <img src="{{ "images/tree-logo.png" | relURL }}" alt="" class="nav-tree">
                <span class="nav-title">Come Follow Me Corner</span>
            </a>
            <div class="nav-links">
                <a href="{{ "" | relURL }}/"{{ if .IsHome }} class="active"{{ end }}>Home</a>
                <a href="{{ "about/" | relURL }}"{{ if hasPrefix .RelPermalink "/about/" }} class="active"{{ end }}>About</a>
                <a href="{{ "weeks/" | relURL }}"{{ if hasPrefix .RelPermalink "/weeks/" }} class="active"{{ end }}>Weekly Lessons</a>
                <a href="{{ "resources/" | relURL }}"{{ if hasPrefix .RelPermalink "/resources/" }} class="active"{{ end }}>Resources</a>
                <form class="nav-search-mobile" action="{{ "search/" | relURL }}" method="get" onsubmit="event.preventDefault(); window.location.href=this.action + '#' + encodeURIComponent(this.querySelector('input').value);">
                    <input type="text" placeholder="Search the site..." aria-label="Search site">
                </form>
            </div>
            <form class="nav-search" action="{{ "search/" | relURL }}" method="get" onsubmit="event.preventDefault(); window.location.href=this.action + '#' + encodeURIComponent(this.querySelector('input').value);">
                <svg class="nav-search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" placeholder="Search..." aria-label="Search site">
            </form>
            <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">&#9776;</button>
        </div>
    </nav>

    <main class="site-main">
        {{ block "main" . }}{{ end }}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">COME FOLLOW ME CORNER</div>
            <div class="footer-li">
                <a href="https://learninginspired.com" target="_blank" rel="noopener">
                    <img src="{{ "images/learning-inspired-logo.png" | relURL }}" alt="Learning Inspired" class="footer-li-logo">
                </a>
            </div>
            <p>&copy; {{ now.Year }} Learning Inspired LLC</p>
            <p class="footer-disclaimer">Not affiliated with The Church of Jesus Christ of Latter-day Saints</p>
        </div>
    </footer>

    {{ block "scripts" . }}{{ end }}
</body>
</html>
