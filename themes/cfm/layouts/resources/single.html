{{ define "head" }}
<style>
    .resource-page {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
    }
    .resource-page h1 {
        font-family: Georgia, serif;
        color: #1e3a4f;
        font-weight: normal;
        font-size: 2em;
        margin-bottom: 8px;
    }
    .resource-breadcrumb {
        font-size: 0.85em;
        color: #57899c;
        margin-bottom: 24px;
    }
    .resource-breadcrumb a {
        color: #57899c;
        text-decoration: none;
    }
    .resource-breadcrumb a:hover {
        color: #1e3a4f;
        text-decoration: underline;
    }
    .resource-intro {
        font-size: 1.05em;
        color: #555;
        line-height: 1.7;
        margin-bottom: 32px;
        padding-bottom: 24px;
        border-bottom: 1px solid #e8ede9;
    }
    .resource-page h2 {
        font-family: Georgia, serif;
        color: #1e3a4f;
        font-size: 1.4em;
        font-weight: normal;
        margin-top: 36px;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 2px solid #d5a93c;
    }
    .resource-page h3 {
        font-family: Georgia, serif;
        color: #4a6b52;
        font-size: 1.1em;
        font-weight: 600;
        margin-top: 24px;
        margin-bottom: 12px;
    }
    .resource-page ul {
        list-style: none;
        padding: 0;
    }
    .resource-page ul li {
        background: #f7f8fa;
        border-left: 3px solid #57899c;
        padding: 14px 18px;
        margin-bottom: 10px;
        border-radius: 0 6px 6px 0;
        line-height: 1.6;
        font-size: 0.95em;
    }
    .resource-page ul li strong a {
        color: #1e3a4f;
        text-decoration: none;
        font-size: 1.05em;
    }
    .resource-page ul li strong a:hover {
        color: #4a6b52;
        text-decoration: underline;
    }
    .resource-page ul li a {
        color: #57899c;
    }
    .resource-page ul li a:hover {
        color: #1e3a4f;
    }
    .resource-page blockquote {
        background: linear-gradient(135deg, #f7f8fa 0%, #edf0f3 100%);
        border-left: 4px solid #d5a93c;
        padding: 20px 24px;
        margin: 24px 0;
        border-radius: 0 8px 8px 0;
        font-style: italic;
        color: #444;
        font-family: Georgia, serif;
        line-height: 1.7;
    }
    .resource-page blockquote em {
        display: block;
        margin-top: 8px;
        font-style: normal;
        color: #57899c;
        font-size: 0.9em;
    }
    .resource-page p {
        line-height: 1.7;
        color: #444;
    }
    .resource-back {
        display: inline-block;
        margin-top: 32px;
        padding: 10px 20px;
        background: #4a6b52;
        color: white;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9em;
        font-weight: 600;
    }
    .resource-back:hover {
        background: #3a5a42;
        color: white;
    }
    @media (max-width: 768px) {
        .resource-page { padding: 24px 16px; }
        .resource-page h1 { font-size: 1.6em; }
        .resource-page h2 { font-size: 1.2em; }
        .resource-page ul li { padding: 12px 14px; font-size: 0.9em; }
        .resource-page blockquote { padding: 16px 18px; }
    }
    @media (max-width: 480px) {
        .resource-page { padding: 16px 12px; }
        .resource-page h1 { font-size: 1.35em; }
        .resource-page h2 { font-size: 1.1em; margin-top: 28px; }
        .resource-page ul li { padding: 10px 12px; }
        .resource-back { width: 100%; text-align: center; }
    }
</style>
{{ end }}

{{ define "main" }}
<div class="resource-page">
    <div class="resource-breadcrumb">
        <a href="{{ "resources/" | relURL }}">Resources</a> › {{ .Title }}
    </div>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    <a href="{{ "resources/" | relURL }}" class="resource-back">← Back to Resources</a>
</div>
{{ end }}
