outer-gate:
  definition: "Hebrew term for a screen or hanging curtain. In the Tabernacle context it refers to the woven entrance screen marking a sacred threshold."
outer-court:
  definition: "Hebrew term for a court or enclosed courtyard. Here it names the outer court that surrounded the Tabernacle tent."
brazen-altar:
  definition: "Literally 'altar of ascent' or burnt offering altar. The offering placed here ascended in smoke before God."
laver:
  definition: "Hebrew term for a basin or laver. The priests washed here before entering into sacred service."
ceiling-coverings:
  definition: "Hebrew term for a covering. In the Tabernacle it refers to the layered coverings that sheltered the sacred tent."
tent-entrance:
  definition: "Hebrew phrase for the entrance screen of the tent, the woven hanging that marked entry into the Holy Place."
holy-place:
  definition: "Hebrew term for a holy place. This was the first chamber inside the Tabernacle where daily priestly ministry took place."
menorah:
  definition: "Hebrew term for the seven-branched lampstand that gave light inside the Holy Place."
table-showbread:
  definition: "Hebrew phrase meaning 'table of the bread of the Presence' or 'bread of the face,' the sacred bread set continually before the Lord."
incense-altar:
  definition: "Hebrew phrase for the altar of incense, the small golden altar placed before the veil."
inner-veil:
  definition: "Hebrew term for the inner veil or curtain that marked the boundary before the Most Holy Place."
most-holy-place:
  definition: "Hebrew phrase meaning 'Holy of Holies' or 'Most Holy Place,' the innermost chamber of the Tabernacle."
ark:
  definition: "Hebrew phrase meaning 'ark of the covenant,' the sacred chest that held the covenant testimony."
high-priest-overview:
  definition: "Hebrew phrase meaning 'great priest' or 'high priest,' the chief officiating priest who represented Israel before God."
forehead-plate:
  definition: "Hebrew term often translated 'plate' or 'blossom,' used for the golden frontlet worn on the High Priest's forehead."
turban:
  definition: "Hebrew term for the High Priest's turban or wrapped headpiece."
shoulder-stones:
  definition: "Hebrew phrase for the onyx stones set on the ephod shoulders, engraved with the names of the tribes of Israel."
breastplate:
  definition: "Hebrew phrase often rendered 'breastplate of judgment' or 'breastpiece of decision,' worn over the High Priest's heart."
urim-thummim:
  definition: "Hebrew phrase for the Urim and Thummim, the sacred lot or revelatory instrument associated with priestly inquiry before the Lord."
ephod:
  definition: "Hebrew term for the ornate priestly vestment worn over the robe and under the breastplate."
sash:
  definition: "Hebrew term for the woven sash or girdle tied around the priest's waist."
blue-robe:
  definition: "Hebrew phrase meaning 'robe of the ephod,' the blue garment worn beneath the ephod."
bells-pomegranates:
  definition: "Hebrew phrase naming the golden bells and pomegranates sewn around the hem of the robe."
white-linen:
  definition: "Hebrew term for the linen tunic worn by the priest as the foundational garment next to the body."
mishkan:
  definition: "Hebrew term meaning 'dwelling place' or 'tabernacle.' It emphasizes that the sanctuary was the place where God chose to dwell among His covenant people."
mikdash:
  definition: "Hebrew term meaning 'sanctuary' or 'holy place,' highlighting the Tabernacle as a space set apart to God."
ohel-moed:
  definition: "Hebrew phrase meaning 'tent of meeting,' the appointed place where God met with His people."
sakhakh:
  definition: "Hebrew root meaning 'to cover, shelter, hedge, or screen.' It stands behind words for protective covering and temporary shelter."
sukkah:
  definition: "Hebrew term meaning 'booth,' 'hut,' or 'temporary shelter,' especially the ritual booth used during the Feast of Tabernacles."
sukkot:
  definition: "Hebrew plural meaning 'booths' or 'tabernacles.' It names the Feast of Tabernacles, the festival commemorating God's sheltering care."
tekhelet:
  definition: "Hebrew term for the blue-violet sacred dye used in Tabernacle textiles and priestly garments, traditionally associated with heaven."
argaman:
  definition: "Hebrew term for the costly purple dye used in sacred textiles, often associated with royalty and splendor."
tolaat-shani:
  definition: "Hebrew phrase literally meaning 'scarlet worm' or 'crimson of the worm,' the scarlet dye derived from the kermes insect."
shesh:
  definition: "Hebrew term for fine linen, the bright white foundational fabric used throughout the Tabernacle and priestly clothing."
maaseh-roqem:
  definition: "Hebrew phrase meaning 'embroidered work' or 'needlework,' a sacred textile technique used on the outer gate and tent entrance."
roqem:
  definition: "Hebrew term for embroidered or needle-worked fabric, a skilled but less exalted textile technique than choshev."
choshev:
  definition: "Hebrew term meaning skillful design-work, often rendered 'cunning work' or 'designer weaving,' used for the most sacred Tabernacle textiles."
chatzer:
  definition: "Hebrew term for a court or enclosed courtyard, here referring to the outer court surrounding the Tabernacle."
mizbach-ha-olah:
  definition: "Hebrew phrase meaning 'altar of ascent' or 'altar of burnt offering,' the bronze altar where offerings ascended in smoke."
korban:
  definition: "Hebrew term for an offering or oblation, from a root meaning 'to draw near,' emphasizing sacrifice as approach to God."
qarav:
  definition: "Hebrew root meaning 'to draw near, approach, or come close.' It stands behind the idea of offering as nearness."
samakh:
  definition: "Hebrew verb meaning 'to lean, press, or lay upon,' used for the worshiper's deliberate hand-placement on a sacrificial animal."
lirtzono:
  definition: "Hebrew expression meaning 'for his acceptance' or 'of his own free will,' used in sacrificial contexts."
olah:
  definition: "Hebrew term for a burnt offering, literally an offering that 'goes up' in smoke, symbolizing total consecration."
shelamim:
  definition: "Hebrew term for peace, fellowship, or completion offerings, often shared as a covenant meal."
minchah:
  definition: "Hebrew term for a grain offering, tribute offering, or gift brought before God."
chatat:
  definition: "Hebrew term for a sin or purification offering, addressing sin's defilement and restoring purity."
asham:
  definition: "Hebrew term for a guilt or restitution offering brought for specific wrongdoing requiring repayment."
kiyyor:
  definition: "Hebrew term for a basin or laver used for priestly washing before sacred service."
marot:
  definition: "Hebrew term meaning 'mirrors' or 'seeing things,' used for the bronze mirrors donated to make the laver."
raah:
  definition: "Hebrew verb meaning 'to see, perceive, or behold.'"
tachash:
  definition: "Hebrew term for the mysterious outer covering material of the Tabernacle; its exact animal or source remains uncertain."
adonim:
  definition: "Hebrew term for bases or sockets, especially the structural sockets that held the Tabernacle frames."
kesef:
  definition: "Hebrew term for silver; the related root can also carry the idea of longing or desire."
kasaf:
  definition: "Hebrew root meaning 'to long for, desire, or yearn,' related to the noun kesef (silver)."
masakh-ha-petach:
  definition: "Hebrew phrase meaning 'the screen of the entrance,' the woven hanging at the doorway to the Holy Place."
kodesh:
  definition: "Hebrew term meaning 'holy place' or 'holiness,' denoting that which is set apart to God."
ner:
  definition: "Hebrew term for a lamp or light."
miqshah:
  definition: "Hebrew term meaning 'beaten work,' describing metal hammered from a single piece."
katit:
  definition: "Hebrew term meaning 'beaten' or 'crushed,' used of the highest grade of hand-pressed olive oil."
gat-shemanim:
  definition: "Hebrew phrase meaning 'olive press,' the meaning behind the name Gethsemane."
betzalel:
  definition: "Hebrew name meaning 'in the shadow of God,' borne by the artisan appointed to build the Tabernacle."
tzel:
  definition: "Hebrew term meaning 'shadow' or 'shade.'"
shamash:
  definition: "Hebrew term meaning 'servant' or 'attendant,' later used for the helper candle or lamp."
shemesh:
  definition: "Hebrew term for the sun."
shulchan:
  definition: "Hebrew term for a table."
lechem-ha-panim:
  definition: "Hebrew phrase meaning 'bread of the Presence' or literally 'bread of the face.'"
panim:
  definition: "Hebrew term meaning 'face' or 'presence.'"
beit-lechem:
  definition: "Hebrew place-name meaning 'house of bread,' the meaning of Bethlehem."
mizbach-ha-ketoret:
  definition: "Hebrew phrase meaning 'altar of incense,' the golden altar before the veil."
tamid:
  definition: "Hebrew term meaning 'continually,' 'regularly,' or 'perpetually,' used for ongoing sacred service."
parokhet:
  definition: "Hebrew term for the inner veil or curtain dividing the Holy Place from the Most Holy Place."
maaseh-choshev:
  definition: "Hebrew phrase meaning skillful designer-work, the elevated weaving technique used for the most sacred textiles."
kodesh-ha-kodashim:
  definition: "Hebrew phrase meaning 'Holy of Holies' or 'Most Holy Place,' the innermost sanctuary."
aron:
  definition: "Hebrew term for a chest, ark, or coffin, used for both Joseph's coffin and the Ark of the Covenant."
kapporet:
  definition: "Hebrew term for the atonement cover or Mercy Seat atop the Ark of the Covenant."
kaphar:
  definition: "Hebrew root meaning 'to cover, purge, or atone.'"
kohen-gadol:
  definition: "Hebrew phrase meaning 'high priest' or 'great priest.'"
lekhavod-uletifaret:
  definition: "Hebrew phrase meaning 'for glory and for beauty,' describing the purpose of the High Priest's garments."
kodesh-la-yhwh:
  definition: "Hebrew phrase meaning 'Holiness to the LORD,' engraved on the High Priest's forehead plate."
mikhnasayim:
  definition: "Hebrew term for linen undergarments or trousers worn by the priests."
ketonet:
  definition: "Hebrew term for a tunic or long undergarment, the foundational priestly robe."
avnet:
  definition: "Hebrew term for a girdle, sash, or wrapped waistband."
migbaah:
  definition: "Hebrew term for the cap or head covering worn by ordinary priests."
mitznefet:
  definition: "Hebrew term for the High Priest's turban or wrapped headpiece."
meil:
  definition: "Hebrew term for a robe or mantle."
efod:
  definition: "Hebrew term for the ornate priestly vestment worn over the robe and under the breastplate."
choshen-mishpat:
  definition: "Hebrew phrase meaning 'breastplate of judgment' or 'breastpiece of decision,' worn over the High Priest's heart."
tzitz:
  definition: "Hebrew term meaning 'plate,' 'flower,' or 'blossom,' used for the golden ornament on the High Priest's forehead."
mashiach:
  definition: "Hebrew term meaning 'anointed one,' the source of the title Messiah."
mashach:
  definition: "Hebrew verb meaning 'to anoint' or 'to smear with oil.'"
moed:
  definition: "Hebrew term meaning an appointed time, festival, or meeting."
choshen:
  definition: "Hebrew term for a breastpiece or breastplate."
nasa-et-avon:
  definition: "Hebrew phrase meaning 'to bear iniquity' or 'carry guilt.'"
et-avon-hakodashim:
  definition: "Hebrew phrase meaning 'the iniquity of the holy things,' describing the High Priest's bearing of Israel's sacred imperfections before the Lord."
azut-panim:
  definition: "Hebrew phrase meaning brazenness, shamelessness, or hardness of face."
nezer-ha-kodesh:
  definition: "Hebrew phrase meaning 'the crown of holiness' or 'holy diadem.'"
gasut-ha-ruach:
  definition: "Hebrew phrase meaning arrogance, loftiness, or haughtiness of spirit."
avnei-shoham:
  definition: "Hebrew phrase meaning 'onyx stones' or stones of shoham, used for the engraved shoulder stones."
pituchei-chotam:
  definition: "Hebrew phrase meaning seal engravings or signet-cut inscriptions."
odem:
  definition: "Hebrew name of the first breastplate stone, associated with a red gemstone, often identified with carnelian."
sappir:
  definition: "Hebrew name of a breastplate stone traditionally understood as lapis lazuli rather than modern sapphire."
achlamah:
  definition: "Hebrew name of a breastplate stone commonly identified as amethyst."
urim-ve-tummim:
  definition: "Hebrew phrase meaning 'Lights and Perfections,' the sacred revelatory instrument associated with priestly inquiry."
urim:
  definition: "Hebrew plural term meaning 'lights.'"
or:
  definition: "Hebrew term meaning 'light.'"
thummim:
  definition: "Hebrew plural term meaning 'perfections,' 'integrities,' or 'completions.'"
tom:
  definition: "Hebrew root carrying the sense of wholeness, integrity, or completeness."
cheshev:
  definition: "Hebrew term for the artistically woven waistband or band of the ephod."
avodah-zarah:
  definition: "Hebrew phrase meaning 'strange worship' or 'idolatry.'"
degel:
  definition: "Hebrew term meaning a standard, banner, or tribal ensign under which a larger camp division was ordered."
ot:
  definition: "Hebrew term meaning a sign, token, or identifying mark."
machaneh:
  definition: "Hebrew term meaning camp, encampment, or military camp."
meil-ha-efod:
  definition: "Hebrew phrase meaning 'the robe of the ephod,' the all-blue robe worn beneath the ephod."
kotnot-or:
  definition: "Hebrew phrase meaning 'garments of skin,' the clothing God made for Adam and Eve after the Fall."
masakh:
  definition: "Hebrew term for a screen, hanging curtain, or veil, especially a woven threshold-marker for sacred space."
metarim:
  definition: "Hebrew term for cords, tent ropes, or measuring lines, used to secure and stretch a tent structure."
nechoshet:
  definition: "Hebrew term for bronze or copper alloy, the characteristic metal of the outer court furnishings."
kofer-nafsho:
  definition: "Hebrew phrase meaning 'a ransom for his soul' or 'atonement price for his life.'"
yated:
  definition: "Hebrew term for a peg, pin, or stake driven in for fastening or support."
yetedot:
  definition: "Hebrew term for pegs, tent stakes, or pins used to anchor the Tabernacle and courtyard."
vav:
  definition: "Hebrew term for a hook; also the name of the sixth Hebrew letter, often functioning as the conjunction 'and.'"
vavim:
  definition: "Hebrew plural of vav, meaning hooks used to fasten or suspend the Tabernacle hangings."
shaqed:
  definition: "Hebrew term for almond, especially the almond branch or blossom."
shoqed:
  definition: "Hebrew participial form meaning 'watching' or 'watchful,' used in wordplay with almond imagery."
hokhmah:
  definition: "Hebrew term meaning wisdom, skill, or divinely given craftsmanship."
ketoret:
  definition: "Hebrew term for incense, especially the sacred blended incense burned before the Lord."
chelbenah:
  definition: "Hebrew term for galbanum, one of the ingredients in the holy incense blend."
shittim:
  definition: "Hebrew term for acacia wood, the desert timber used in major Tabernacle furnishings."
moadim:
  definition: "Hebrew plural meaning appointed times, festivals, or sacred seasons."
petil-tekhelet:
  definition: "Hebrew phrase meaning a cord or thread of tekhelet, the blue fastening thread used with sacred garments and fringes."
paamonei-zahav:
  definition: "Hebrew phrase meaning golden bells, especially the bells sewn to the hem of the High Priest's robe."
rimmonim:
  definition: "Hebrew term for pomegranates, the fruit-symbol attached to the hem of the robe."
avon-ha-kodashim:
  definition: "Hebrew phrase meaning 'the iniquity of the holy things,' emphasizing the burden of sacred imperfection borne by the High Priest."
avnei:
  definition: "Hebrew construct form meaning 'stones of' or 'stones belonging to.'"
avon:
  definition: "Hebrew term meaning iniquity, guilt, or the burden of wrongdoing."
bigdei:
  definition: "Hebrew construct form meaning garments, clothing, or vestments of."
bareqet:
  definition: "Hebrew name of a breastplate stone; its exact modern identification is uncertain, though it is often associated with a flashing or gleaming green stone."
bigdei-lavan:
  definition: "Hebrew phrase meaning 'white garments,' especially the plain white linen vestments used on the Day of Atonement."
bigdei-zahav:
  definition: "Hebrew phrase meaning 'golden garments,' the full ornate High Priestly vestments worn in regular sanctuary service."
brit:
  definition: "Hebrew term meaning covenant, treaty, or binding relationship."
davar:
  definition: "Hebrew term meaning word, matter, or spoken utterance."
dēlōsis-kai-alētheia:
  definition: "Greek phrase meaning 'manifestation and truth,' one ancient rendering associated with the interpretive sense of Urim and Thummim."
gadol:
  definition: "Hebrew term meaning great, large, chief, or exalted."
gilui-arayot:
  definition: "Hebrew rabbinic phrase meaning forbidden sexual exposure or sexual immorality."
hirhurei-ha-lev:
  definition: "Hebrew phrase meaning the inward thoughts, stirrings, or imaginations of the heart."
kafol:
  definition: "Hebrew term meaning 'doubled' or 'folded over,' used of the breastplate pouch construction."
kavod:
  definition: "Hebrew term meaning glory, weight, honor, or splendor."
keter:
  definition: "Hebrew term meaning crown, diadem, or circlet."
kodashim:
  definition: "Hebrew plural meaning holy things, sacred things, or consecrated objects."
kohen:
  definition: "Hebrew term meaning priest, one who ministers in sacred service before the Lord."
kol:
  definition: "Hebrew term meaning voice, sound, or audible report."
kotnot:
  definition: "Hebrew plural of ketonet, meaning tunics or long garments."
lashon-hara:
  definition: "Hebrew phrase meaning evil speech, slander, or destructive talk."
leshem:
  definition: "Hebrew name of a breastplate stone whose exact identification remains uncertain."
mishpat:
  definition: "Hebrew term meaning judgment, justice, decision, or ordered discernment."
nofekh:
  definition: "Hebrew name of a breastplate stone whose exact modern equivalent is uncertain."
ohel:
  definition: "Hebrew term meaning tent, dwelling, or portable shelter."
petil:
  definition: "Hebrew term meaning cord, thread, or twisted fastening strand."
pitdah:
  definition: "Hebrew name of a breastplate stone commonly associated with an ancient green-gold stone such as peridot."
sappheiros:
  definition: "Ancient Greek stone name usually referring to lapis lazuli rather than modern sapphire."
shefikhut-damim:
  definition: "Hebrew rabbinic phrase meaning bloodshed or the shedding of blood."
shevo:
  definition: "Hebrew name of a breastplate stone often identified with agate or banded chalcedony."
shoham:
  definition: "Hebrew name of the shoulder and breastplate stone traditionally rendered onyx, though its exact identity is debated."
tarshish:
  definition: "Hebrew name of a breastplate stone often associated with a golden or golden-green imported stone."
tifaret:
  definition: "Hebrew term meaning beauty, adornment, splendor, or glorious ornament."
topazion:
  definition: "Ancient Greek stone name usually referring to the green-gold Red Sea stone later identified with peridot."
yhwh:
  definition: "The covenant name of the God of Israel, often represented in English as LORD."
yahalom:
  definition: "Hebrew name of a breastplate stone whose exact identification is uncertain; later translations differ sharply."
yashfeh:
  definition: "Hebrew name of a breastplate stone commonly associated with jasper, though the exact hue remains uncertain."
zahav:
  definition: "Hebrew term meaning gold, golden metal, or gold material."
lavan:
  definition: "Hebrew term meaning white or whiteness."
