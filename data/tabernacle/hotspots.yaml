        ### מְנַשֶּׁה — "Causing to Forget"

        **Mother:** Asenath (wife of Joseph, daughter of Potiphera) | **Birth Sequence:** Grandson of Jacob — firstborn son of Joseph, born in Egypt (Genesis 41:51; 48:13–20)

        <details class="tribe-section" open>
        <summary>The Brother</summary>
        <div>

        Manasseh was the firstborn son of Joseph, born in Egypt before the famine. Joseph named him Manasseh, saying, "God hath made me forget all my toil, and all my father's house" (Genesis 41:51). The name *Menasheh* (מְנַשֶּׁה) comes from *nashah* (נָשָׁה), "to forget" — God's healing, allowing Joseph to move forward from trauma without being consumed by it. "Causing to forget" is not erasure; it is the grace of being able to build a new life without the old wounds defining every step.

        Manasseh's story is inseparable from his brother Ephraim's. Despite being the firstborn, Manasseh received the lesser blessing when Jacob crossed his hands (Genesis 48:13–20). Jacob was deliberate: "I know it, my son, I know it." Manasseh would be great, but Ephraim would be greater.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Blessings</summary>
        <div>

        **Jacob's Blessing (Genesis 48:19; 49:22–26):** Manasseh shares Joseph's blessing of fruitfulness and expansive territory. Jacob specifically promises Manasseh "also shall become a people, and he also shall be great" — not diminished, but positioned differently.

        **Moses' Blessing (Deuteronomy 33:13–17):** "They are the thousands of Manasseh." The horns that push the people together belong to both brothers, though Ephraim receives the "ten thousands."

        </div>
        </details>

        <details class="tribe-section">
        <summary>Gideon — Manasseh's Greatest Judge</summary>
        <div>

        Manasseh's defining figure is Gideon (Judges 6–8). When the angel appeared, Gideon was hiding from the Midianites. The angel's greeting was almost ironic: "The LORD is with thee, thou mighty man of valour" (Judges 6:12). Gideon protested: "My family is poor in Manasseh, and I am the least in my father's house" (Judges 6:15). God then reduced his army from 32,000 to 300 — "lest Israel vaunt themselves against me, saying, Mine own hand hath saved me" (Judges 7:2). With lamps, trumpets, and empty pitchers, the 300 routed the Midianite host. The wild ox on Manasseh's banner found its living expression in Gideon: a man who seemed least, achieving a victory that could only be God's.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Split Inheritance</summary>
        <div>

        Manasseh was unique — half the tribe settled east of the Jordan in Bashan and Gilead, half west in the hill country (Joshua 17). No other tribe occupied both sides of the river. This split inheritance foreshadowed a people who would carry the covenant across boundaries.

        </div>
        </details>

        <details class="tribe-section">
        <summary>Lehi and the Book of Mormon</summary>
        <div>

        Lehi, the prophet who led his family to the Americas, was a descendant of Manasseh (Alma 10:3). The peoples of the Book of Mormon descend from Joseph through Manasseh, not Ephraim. The record is the stick of Ephraim (D&C 27:5), but the people it chronicles are Manassites. Manasseh's split inheritance — half on each side of the Jordan — foreshadows a people who would cross not just a river but an ocean.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Tribe</summary>
        <div>

        **Census:** 32,200 men under Ephraim's standard.

        **Banner — Two Traditions:**
        - **Breastplate (birth-order tradition):** shared *shoham* (שֹׁהַם) with Joseph's house. The banner artwork in this field guide uses this color.
        - **Bamidbar Rabbah 2:7:** also *shoham*, with a deep black flag bearing a wild ox (*re'em*), alluding to Gideon.

        **Historical Role:** The half-tribe east of the Jordan was among the first carried away by Assyria (1 Chronicles 5:26). Yet Manasseh produced Gideon, and from Manasseh's line came Lehi. The tribe's legacy is individual faithfulness against overwhelming odds.

        </div>
        </details>

        <details class="tribe-section" open>
        <summary>Gathering of Israel</summary>
        <div>

        Manasseh represents those scattered across boundaries who retain covenant identity. The name "Causing to Forget" carries healing: God enables His people to move beyond exile's wounds without forgetting who they are. The Gathering is not a solo mission — Ephraim leads, but Manasseh labors alongside. The Book of Mormon — a Manassite record delivered through Ephraimite hands — proves Joseph's two sons work together to accomplish the Father's purposes.

        </div>
        </details>

