      y: 50
      copy: |
        ### יִשָּׂשכָר — "There Is a Reward"

        **Mother:** Leah | **Birth Sequence:** 9th son of Jacob (Genesis 30:18)

        <details class="tribe-section" open>
        <summary>The Brother</summary>
        <div>

        Issachar was the ninth son of Jacob and the fifth of Leah. His birth is inseparable from one of the most unusual episodes in Genesis — the mandrake bargain. Young Reuben found mandrakes (*duda'im*, דּוּדָאִים) in the field during wheat harvest and brought them to his mother Leah (Genesis 30:14). Rachel wanted them and offered Leah a night with Jacob in exchange. Leah agreed, and from that night conceived Issachar. At his birth she said, "God hath given me my hire, because I have given my maiden to my husband" (Genesis 30:18). The name *Yissakhar* (יִשָּׂשכָר) comes from *sakhar* (שָׂכָר), "wages," "reward," or "hire."

        The irony is layered: Issachar's very existence is the product of a trade — Rachel's mandrakes exchanged for Leah's night with Jacob. Yet the "hire" Leah celebrates is not the transaction itself but God's reward for her faithfulness. The ancient Jewish philosopher Philo of Alexandria saw in this a deeper meaning: Issachar represents "the man who does good actions," whose "hire is in his soul after he has been sown and planted, so that his labour is not imperfect, but is rather crowned and honoured with a reward by God" (Philo, *Allegorical Interpretation*). Where Judah represents confession and worship, Issachar represents practice and faithful labor.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Blessings</summary>
        <div>

        **Jacob's Blessing (Genesis 49:14–15):** "Issachar is a strong ass couching down between two burdens: And he saw that rest was good, and the land that it was pleasant; and bowed his shoulder to bear, and became a servant unto tribute." The image is a strong donkey resting between its loads — strength devoted to labor rather than to war or kingship. Issachar's territory in the fertile Jezreel Valley was among the richest agricultural land in Israel, and the tribe became known for steady, diligent service. The donkey carries; it does not fight for glory.

        **Moses' Blessing (Deuteronomy 33:18–19):** "Rejoice, Zebulun, in thy going out; and, Issachar, in thy tents. They shall call the people unto the mountain; there they shall offer sacrifices of righteousness." Moses pairs Issachar with Zebulun in a single blessing — Zebulun goes out (commerce and travel) while Issachar stays in the tents (study and teaching). Together they "call the people unto the mountain." Issachar's contribution to Israel is not outward action but inward learning that equips the entire community.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Issachar-Zebulun Partnership</summary>
        <div>

        This pairing became one of the most celebrated relationships in rabbinic tradition. Bereishit Rabbah 99:9 explains why Moses mentions Zebulun *before* Issachar, despite Issachar being the older brother: "Zebulun preceded Issachar, although the birth of Issachar is recorded before Zebulun. Why so? It is because Zebulun would engage in commerce, and Issachar would engage in Torah, and Zebulun would come to feed him." The midrash interprets Moses' blessing: "Rejoice, Zebulun, in your departure... because Issachar, in your tents — the tents are yours, as you assist him to reside in them."

        The principle: "It is a tree of life for those who uphold it" — the supporter of Torah study shares fully in its spiritual merit. This partnership became the foundational model in Jewish communal life for the relationship between those who study and those who sustain the work of study through material support. A merchant who funds a scholar's learning shares equally in the Torah that scholar produces.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Tribe</summary>
        <div>

        **Census:** 54,400 men under Judah's standard in the eastern camp.

        **Banner — Two Traditions:**
        - **Breastplate (birth-order tradition):** *achlamah* (אַחְלָמָה), rendered as purple. The banner artwork in this field guide uses this color.
        - **Bamidbar Rabbah 2:7:** assigns *sappir* (not *achlamah*) and describes the flag as blackish blue bearing the sun and moon, drawn from 1 Chronicles 12:32: "the children of Issachar, which were men that had understanding of the times".

        **Historical Role:** Issachar became known in Israel as the tribe of scholars and judges — "men that had understanding of the times." Bereishit Rabbah 72:5 notes that "Issachar was the ninth of the tribes, but he brought his offering second to the king" due to his status as a "Torah personality." The tribe's territory in the Jezreel Valley was rich and productive, but Issachar's lasting contribution was wisdom, not wheat.

        </div>
        </details>

        <details class="tribe-section" open>
        <summary>Gathering of Israel</summary>
        <div>

        Issachar's mission — understanding the times and knowing what Israel ought to do — speaks directly to the work of the Gathering. The Hebrew concepts embedded in this calling are important to understand correctly. The "signs" that Issachar read were *otot* (אוֹתוֹת) — the covenant signs God placed in creation to mark His appointed purposes (Genesis 1:14). The "seasons" they discerned were *moedim* (מוֹעֲדִים) — the appointed times, the sacred calendar of feasts and holy convocations through which God taught His people to recognize His hand in history (Leviticus 23).

        The Israelites closely monitored the stars and celestial patterns — the heavens were integral to their calendar, their agriculture, and their understanding of God's created order. What they did *not* do was worship the heavenly bodies as deities or treat them as independent forces controlling human destiny. That was the pagan practice: identifying the sun, moon, and stars as gods whose movements dictated personal fortune. The distinction is not between observing the heavens and ignoring them — it is between recognizing the heavens as *God's creation, declaring His glory* (Psalm 19:1) and treating them as *rival powers to be appeased or consulted*. Issachar's gift was reading the *otot* and *moedim* that God Himself had set in the heavens (Genesis 1:14) — not as fortune-telling, but as covenant literacy: understanding God's calendar, His patterns, and His purposes well enough to know "what Israel ought to do."

        In every dispensation, the Lord needs people with this kind of understanding — readers of the *moedim* and the *otot*, who can discern the appointed times and teach the covenant people about what these observations can teach us. Astronomers, scientists, linguists, prophetic literacy, and gospel scholarship are all part of Issachar's legacy. Those who devote themselves to understanding the word of God and helping others apply it carry forward the spirit of this tribe. And the Issachar-Zebulun model reminds us that scholarship does not happen in isolation — it requires a community willing to sustain those who study.

        </div>
        </details>

