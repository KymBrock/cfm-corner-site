      x: 39
      y: 25
      copy: |
        The *shulchan* (שֻׁלְחָן) held twelve loaves of *lechem ha-panim* (לֶחֶם הַפָּנִים) — literally "bread of the face" or "bread of the Presence" — in the Holy Place (Ex 25:23-30). Twelve loaves, one for each tribe, arranged in two rows of six on a gold-overlaid acacia table. Replaced every Sabbath, the old loaves were eaten by the priests in the holy place (Lev 24:5-9). Pure frankincense was placed on the rows and burned as a memorial when the bread was changed (Lev 24:7).
        
        The word *panim* (פָּנִים) — face, presence — is theologically rich. The bread existed before God's *face*. It was not merely displayed; it was positioned in His personal, immediate presence. God's table was always set. No tribe was absent. The bread before God's face was provision and presence at once — God feeding His covenant people in His own company.
      deep_dive: |
        ### Manna and Showbread — The Same Measure
        
        Each showbread loaf was made from two-tenths of an ephah of fine flour (Lev 24:5). This is the same amount of manna each Israelite household gathered as a double portion in preparation for the Sabbath (Ex 16:22; cf. Ex 16:36, where one omer = one-tenth of an ephah). The double Sabbath manna portion and the showbread loaf are the same measure.
        
        The wilderness provision and the sanctuary provision used the same portion. What God fed Israel in the desert, He continued to place before His face in the Tabernacle — the same amount, now on a golden table, in His presence, every Sabbath.
        
        ### The Frankincense — God's Portion of the Meal
        
        Two portions of pure frankincense were placed on or beside the bread rows (Lev 24:7). When the bread was replaced each Sabbath, the frankincense was burned on the altar as "a memorial, even an offering made by fire unto the LORD." The priests ate the bread; the frankincense ascended to God.
        
        In effect, God and the priests shared a weekly Sabbath meal — the priests eating bread, God receiving the fragrant memorial. The showbread was not merely provision. It was communion.
        
        ### Twelve Loaves, One Table
        
        The twelve loaves were distinct — one for each tribe — but they shared a single table before the same God. Paul draws on this logic: "The body is not one member, but many... the eye cannot say unto the hand, I have no need of thee" (1 Cor 12:14, 21). Each tribe is different. All are present before God. All belong to the same table.
        
        No loaf is expendable. No tribe is absent. All members are wanted and all are invited. The Lord does not want any empty chairs at His table.
        
        The sacrament table continues this pattern. When Latter-day Saints gather on the Sabbath, break bread together, and partake in remembrance of Christ's body, they are doing what the showbread did: placing themselves — all of them — before God's face as one covenant family.
        
        **Note:** The sacrament connection is LDS interpretive application, not biblical exegesis. It is offered here because the structural parallel is strong, not because the text makes the connection explicit.
        
        ### Bethlehem and the Bread of Life
        
        Christ, the bread of life, was born in *Beit Lechem* (בֵּית לֶחֶם) — Bethlehem — literally "the house of bread."
        
        Jesus identified Himself directly: "I am the bread of life: he that cometh to me shall never hunger" (John 6:35). And again: "I am the living bread which came down from heaven: if any man eat of this bread, he shall live for ever: and the bread that I will give is my flesh, which I will give for the life of the world" (John 6:51).
        
        The bread that sustained Israel in the wilderness — manna — and the bread that stood perpetually before God's face in the Tabernacle both point to the same reality: God feeds His covenant people with His own presence. When Christ breaks bread at the Last Supper and says "This is my body which is given for you" (Luke 22:19), the showbread finds its fulfillment. The bread is no longer a symbol placed before God's face — it *is* the body of the One who is God's face turned toward us.
        
        ### David and the Holy Bread
        
        When David fled from Saul, the priest Ahimelech gave him the showbread because there was no ordinary bread at hand (1 Sam 21:6). Jesus later cited this episode (Matt 12:3-4) to establish a principle: human need can override ritual restriction. The bread set apart for God's presence was given to feed a man in desperate need. The holiness of the bread was not violated by this act — it was fulfilled. Sacred provision exists to sustain life, not to be preserved behind walls of regulation while the hungry go without.
