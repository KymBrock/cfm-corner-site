        ### אֶפְרַיִם — "Doubly Fruitful"

        **Mother:** Asenath (wife of Joseph, daughter of Potiphera) | **Birth Sequence:** Grandson of Jacob — younger son of Joseph, born in Egypt (Genesis 41:52; 48:13–20)

        <details class="tribe-section" open>
        <summary>The Brother</summary>
        <div>

        Ephraim was not a son of Jacob but a *grandson* — the younger son of Joseph, born in Egypt to Joseph and Asenath, daughter of Potiphera, priest of On (Genesis 41:50–52). Joseph named him Ephraim, saying, "God hath caused me to be fruitful in the land of my affliction." The name [*Ephrayim*](https://www.blueletterbible.org/lexicon/h669/kjv/wlc/0-1/) (אֶפְרַיִם) comes from the root [*parah*](https://www.blueletterbible.org/lexicon/h6509/kjv/wlc/0-1/) (פָּרָה), "to be fruitful," in a dual form suggesting "double fruitfulness." The name itself is a testimony: fruitfulness not *despite* affliction but *in the midst of it*. The connection between "fruit" and "posterity" runs deep — the word appears repeatedly in Jacob's blessing of Joseph (Genesis 49:22), in JST Genesis 49:9–10, and ten additional times in 2 Nephi 3, the chapter that quotes Joseph's patriarchal testament.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Crossed-Hands Blessing — Genesis 48</summary>
        <div>

        Though younger than Manasseh, Ephraim received the greater blessing. When Jacob blessed Joseph's sons, he deliberately crossed his hands and placed his right hand on Ephraim, the younger, over Joseph's objection (Genesis 48:13–20). Joseph tried to move his father's hand: "Not so, my father: for this is the firstborn." Jacob refused: "I know it, my son, I know it: he also shall become a people, and he also shall be great: but truly his younger brother shall be greater than he, and his seed shall become a multitude of nations" (Genesis 48:19).

        The Hebrew phrase [*melo*](https://www.blueletterbible.org/lexicon/h4393/kjv/wlc/0-1/) (מְלֹא), "fullness," paired with [*hagoyim*](https://www.blueletterbible.org/lexicon/h1471/kjv/wlc/0-1/) (הַגּוֹיִם), "the nations" — together "the fullness of the nations" — became the defining prophecy of Ephraim's role in the last days. Paul later drew on this same phrase in Romans 11:25 — "until the fulness of the Gentiles be come in" — connecting Ephraim's ancient blessing to the gathering of all nations into the covenant.

        This was the fourth consecutive generation in which the birthright passed to one who was not the firstborn — Isaac over Ishmael, Jacob over Esau, Joseph over Reuben, Ephraim over Manasseh. The pattern is unmistakable: God's covenant choices are not determined by birth order. They are determined by divine purpose.

        Jacob also formally adopted Ephraim and Manasseh as his own sons (Genesis 48:5–6): "Ephraim and Manasseh, even as Reuben and Simeon, shall be mine." This adoption elevated Joseph's sons from grandsons to full tribal heads — the reason there are effectively thirteen tribes (twelve plus Levi) and the reason Joseph's house receives a double portion through two tribal allotments.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Blessings</summary>
        <div>

        **Jacob's Blessing (Genesis 49:22–26):** "Joseph is a fruitful bough, even a fruitful bough by a well; whose branches run over the wall ... The blessings of thy father have prevailed above the blessings of my progenitors unto the utmost bound of the everlasting hills."

        This is the most expansive blessing of any tribe. Nahum Sarna observes that "Jacob's has not been a happy life and he cannot but reflect on his deep disappointments over his three oldest sons. Yet now, as death nears, a better future rises before his inner eye. This future is tied to Judah and Joseph." Jacob addresses only these two sons directly — all others are spoken *about* ([KnoWhy OTL12A](https://interpreterfoundation.org/knowhy-otl12a/), Jeffrey M. Bradshaw).

        "His branches run over the wall" — Orson Pratt taught that Joseph's tribe "should become so numerous that they would take up more room than one small inheritance in Canaan, that they would spread out and go to some land at a great distance... Joseph's peculiar blessing was that he should enjoy possessions above Jacob's progenitors to the utmost bounds of the everlasting hills. This would seem to indicate a very distant land from Palestine." During His visit to the Nephites, Christ confirmed: "ye are a remnant of the house of Joseph" and the Americas were "the land of your inheritance; and the Father hath given it unto you" (3 Nephi 15:12–13).

        The JST adds that Joseph's descendants would be "a light unto my people, to deliver them in the days of their captivity, from bondage; and to bring salvation unto them, when they are altogether bowed down under sin" (JST Genesis 48:11). This is the Ephraimite mission in its purest form: deliverance, light, salvation — carried through the seed of Joseph to the nations.

        **Moses' Blessing (Deuteronomy 33:13–17):** "His horns are like the horns of unicorns: with them he shall push the people together to the ends of the earth: and they are the ten thousands of Ephraim, and they are the thousands of Manasseh." The Hebrew [*re'em*](https://www.blueletterbible.org/lexicon/h7214/kjv/wlc/0-1/) (רְאֵם), the wild ox or aurochs, was the most powerful animal the ancient world knew — its horns were a symbol of irresistible strength. Moses assigns the defining mission: gathering the people together to the ends of the earth. D&C 58:45 echoes this same language in describing the responsibility of the elders of the Church in the last days.

        The bull/ox symbolism carries into the temple itself. The twelve oxen supporting the baptismal font — three facing each cardinal direction — represent the tribes of Israel, with the strength of Joseph's house (Ephraim and Manasseh) supporting the covenant work of baptism for the dead. LDS scholar Edward J. Brandt explained: "The twelve oxen represent the tribes of Israel and also signify the strength and power on which God has established his work for the children of mankind" (KnoWhy OTL12A).

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Birthright vs. the Sceptre</summary>
        <div>

        Understanding Ephraim requires grasping a distinction that runs through all of Israel's history: the **birthright** and the **sceptre** were deliberately separated.

        The scripture that makes this explicit is 1 Chronicles 5:1–2: "The birthright was Joseph's" — but — "Judah prevailed above his brethren, and of him came the chief ruler." In other words, when Reuben was disqualified, the privileges of the firstborn were not handed to a single brother. They were split between two.

        **Joseph (through Ephraim) received the birthright** — the double portion of the inheritance. Because Jacob adopted Ephraim and Manasseh as his own sons (Genesis 48:5), Joseph's house received two full tribal allotments instead of one. But the birthright carried more than land. It carried the covenant mantle: the responsibility to bear the priesthood, carry the message of the gospel to the nations, and lead the gathering of Israel in the last days.

        **Judah received the sceptre** — the kingship. The royal line of Israel would run through Judah: David, Solomon, and ultimately the Messiah. Judah's calling was to rule and to preserve the covenant throne until the King of kings came.

        This split generated one of the most significant concepts in Jewish messianic thought: the expectation of **two messianic figures**. *Mashiach ben David* (from Judah) — the king who comes in glory to reign. *Mashiach ben Joseph* (from Joseph/Ephraim) — the suffering servant who is rejected, who dies, and who is mourned. Zechariah 12:10 — "they shall look upon me whom they have pierced, and they shall mourn for him" — is traditionally associated with Mashiach ben Joseph in rabbinic literature. Latter-day Saints recognize that both roles are fulfilled in Jesus Christ: the suffering servant foreshadowed by Joseph's type, and the King on David's throne.

        The practical consequence for Ephraim is this: Ephraim's calling is not kingship but *service*. The birthright tribe carries the priesthood responsibility, the missionary charge, the gathering work. Judah rules; Ephraim gathers. Both are essential. Neither is complete without the other — which is precisely Ezekiel's point when the two sticks become one.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Stick of Ephraim — Ezekiel 37</summary>
        <div>

        Ezekiel received a sign-act: "Take thee one stick, and write upon it, For Judah ... then take another stick, and write upon it, **For Joseph, the stick of Ephraim** ... And join them one to another into one stick; and they shall become one in thine hand" (Ezekiel 37:16–17).

        D&C 27:5 confirms the identification, referring to Moroni as the one "to whom I have committed the keys of the record of the **stick of Ephraim**." The two records — Bible and Book of Mormon — joined together, are the instrument of Ephraim's gathering mission.

        But Ezekiel 37 is about more than two books. The entire chapter is structured around *reunion*: dry bones joined with sinew and flesh (body and spirit reunited), the Lord and Israel reunited, Bible and Book of Mormon joined, and — critically — Ephraim and Judah reunited as one people after centuries of division and enmity (Ezekiel 37:22). The sticks are not merely records; they are *peoples*. The joining of the sticks prophesies the healing of Israel's oldest wound: the division of the kingdom. President Boyd K. Packer taught that the Bible and Book of Mormon are "woven together in such a way that as you pore over one you are drawn to the other."

        </div>
        </details>

        <details class="tribe-section">
        <summary>Hosea's Ephraim — Chosen, Scattered, and Promised Return</summary>
        <div>

        No prophet agonizes over Ephraim the way Hosea does. The entire book is structured as a divine love story with a faithless spouse — and the faithless spouse is consistently named "Ephraim."

        The descent: "Ephraim is joined to idols: let him alone" (Hosea 4:17). "Ephraim is a cake not turned" (Hosea 7:8) — half-baked, culturally assimilated, compromised on both sides. "Ephraim, he hath mixed himself among the people" (Hosea 7:8) — the tribe called to be set apart had blended into the nations.

        Then God's anguish — one of the most emotionally raw passages in all of scripture: "I taught Ephraim also to go, taking them by their arms; but they knew not that I healed them. I drew them with cords of a man, with bands of love" (Hosea 11:3–4). This is a parent watching a child walk away, remembering teaching that child to take its first steps. "How shall I give thee up, Ephraim? how shall I deliver thee, Israel? ... mine heart is turned within me, my repentings are kindled together. I will not execute the fierceness of mine anger, I will not return to destroy Ephraim: **for I am God, and not man**" (Hosea 11:8–9). God's refusal to give up on Ephraim is grounded not in Ephraim's merit but in God's own nature.

        And the promise of return: "Ephraim shall say, What have I to do any more with idols? I have heard him, and observed him: I am like a green fir tree. From me is thy fruit found" (Hosea 14:8). The tribe named for fruitfulness will be fruitful again. The name was always a prophecy.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Tribe</summary>
        <div>

        **Census:** 40,500 men — the smallest tribe in the western camp, yet its leader. The younger over the older, exactly as Jacob ordained. By the second census (Numbers 26:37), Ephraim had declined further to 32,500 — the only tribe in the western camp to shrink. Smallness was never the disqualification; faithfulness was always the criterion.

        **Banner — Two Traditions:**
        - **Breastplate (birth-order tradition):** *shoham* (שֹׁהַם), rendered as red-brown. The banner artwork in this field guide uses this color.
        - **Bamidbar Rabbah 2:7:** also *shoham*, but describes the flag as deep black, bearing a bull (ox) — the *re'em* of Deuteronomy 33:17 — alluding to Joshua son of Nun, an Ephraimite and the one who would lead Israel into the promised land.

        **Historical Role:** Ephraim became the dominant northern kingdom tribe — the prophets frequently called the entire northern kingdom simply "Ephraim." Joshua was an Ephraimite (Numbers 13:8). The Tabernacle stood at Shiloh, in Ephraim's territory, for roughly 300 years — making Ephraim's land the spiritual center of Israel before Jerusalem. Samuel served at Shiloh. The Ark of the Covenant resided there until the Philistines captured it (1 Samuel 4).

        Yet ironically, it was Jeroboam — an Ephraimite — who split the kingdom after Solomon's death and set up golden calves at Bethel and Dan (1 Kings 12:28–29). The tribe called to gather was the one that scattered. When Assyria conquered in 722 BC, the ten northern tribes were deported and lost to history — yet the prophets refused to let Ephraim go. God declared through Jeremiah: "Ephraim is my firstborn" (Jeremiah 31:9) — present tense, centuries after the deportation. The calling was never revoked.

        </div>
        </details>

        <details class="tribe-section">
        <summary>Patriarchal Blessings and the Gathering Today</summary>
        <div>

        The majority of Latter-day Saints who receive patriarchal blessings are declared to be of the lineage of Ephraim or Manasseh. This raises an important question: is the declaration a pronouncement of blood inheritance or of adoption into the covenant family?

        The answer, according to LDS scholarship, is that *it does not matter*. William James Mortimer explains: "An essential part of a patriarchal blessing is a declaration of lineage. The patriarch seeks inspiration to specify the dominant family line that leads back to Abraham. The majority of modern blessings have designated Ephraim or Manasseh as the main link in this tracing, but others of every tribe of Israel have also been named. **Whether this is a pronouncement of blood inheritance or of adoption does not matter.** It is seen as the line and legacy through which one's blessings are transmitted. Thus the blessings 'of Abraham, Isaac and Jacob' are conferred" (cited in KnoWhy OTL12A, Jeffrey M. Bradshaw).

        This understanding is grounded in Abraham 2:10: "I will bless them through thy name; for as many as receive this Gospel shall be called after thy name, and shall be accounted thy seed." The gathering of Israel is not racial or genetic — it is covenantal. A local patriarch in the Democratic Republic of Congo testified: "The children of Israel have been dispersed everywhere in all nations. The blood is completely mixed. Therefore we can say that in every nation there are sons and daughters of Abraham who have the blood of Israel. But there is no way to know except as it is revealed by the Lord to the patriarch."

        The practical significance of the declaration of lineage, as Bradshaw notes, "is not in its assertion of eventual, conditional blessings, but rather in its reminder of our immediate responsibilities to assist with that gathering — on behalf of both the living and those who have passed on." To be declared of Ephraim is to receive a calling, not a compliment. It is the birthright tribe's commission: gather Israel.

        </div>
        </details>

        <details class="tribe-section" open>
        <summary>Gathering of Israel</summary>
        <div>

        Ephraim stands at the center of the latter-day Gathering. The Book of Mormon comes through Joseph's lineage (2 Nephi 3:12). Joseph Smith was of Ephraim — the birthright tribe, the gathering tribe. D&C 133:26–34 describes the return of the ten tribes in the last days, led by Ephraim. Patriarchal blessings declare most Church members as Ephraim — the tribe charged to "push the people together to the ends of the earth."

        Ephraim's seed was scattered *among* all nations so that it could gather *from* all nations. The scattering was not punishment alone — it was positioning. Every nation on earth received a deposit of covenant blood through Ephraim's dispersion, so that when the gospel was restored, there would be someone in every land who would *recognize* the covenant when they heard it. The gathering is a homecoming — and Ephraim, scattered furthest, gathers widest.

        The greatest prophecies of the blessing of Joseph — fruitfulness, branches over the wall, the everlasting hills, light to the captive, the stick joined to Judah's stick — are not ancient history. They are the work now underway. Every missionary called, every temple built, every name submitted for ordinance work, every family sealed is Ephraim fulfilling the commission Jacob pronounced with crossed hands in Egypt: *melo hagoyim* — filling the nations with the covenant of God.

        </div>
        </details>

