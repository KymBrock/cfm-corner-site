layout-and-zones:
  intro_snippet:
    title: "From Approach to Presence"
    copy: "The Tabernacle teaches through movement. Bronze marks the outer court, gold fills the inner chambers, and each threshold narrows approach until the covenant center is reached. The structure is a teaching map of holiness moving inward."
