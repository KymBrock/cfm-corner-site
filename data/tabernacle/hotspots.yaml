        ### שִׁמְעוֹן — "Hearing" / "He Has Heard"

        **Mother:** Leah | **Birth Sequence:** 2nd son of Jacob (Genesis 29:33)

        <details class="tribe-section" open>
        <summary>The Brother</summary>
        <div>

        Simeon was the second son of Jacob and Leah. At his birth, Leah said, "Because the LORD hath heard that I was hated, he hath therefore given me this son also" (Genesis 29:33). The name *Shimon* (שִׁמְעוֹן) comes from *shama* (שָׁמַע), "to hear." Like Reuben's name, Simeon's speaks to Leah's pain and to God's attentiveness to the unloved. God *heard* what Leah suffered.

        Like his brother Levi, Simeon's defining moment came at Shechem. After the assault on their sister Dinah, Simeon and Levi took violent revenge, slaughtering the men of the city by deception (Genesis 34:25–29). Jacob rebuked them: "Ye have troubled me to make me to stink among the inhabitants of the land" (Genesis 34:30). The two brothers share Jacob's curse — but their futures diverge sharply. Levi's fierce energy was eventually redirected toward God at Sinai and consecrated into priestly service. Simeon's was not.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Zimri Crisis — Why Simeon Collapsed</summary>
        <div>

        The event that likely sealed Simeon's decline occurred at Shittim, on the plains of Moab. Numbers 25 records that Israelite men began committing harlotry with Moabite and Midianite women, worshipping Baal of Peor. In the midst of a plague that was already killing thousands, a Simeonite prince named Zimri son of Salu — "a prince of a chief house among the Simeonites" — publicly brought Cozbi, a Midianite princess, into the camp in full view of Moses and the weeping congregation (Numbers 25:6, 14–15). The act was brazen defiance, and it came from Simeon's leadership.

        Phinehas, the grandson of Aaron, "took a javelin in his hand" and "thrust both of them through" (Numbers 25:7–8). The plague stopped — but not before "those that died in the plague were twenty and four thousand" (Numbers 25:9).

        The consequences for Simeon were devastating. Between the first census (Numbers 1:23) and the second census (Numbers 26:14), Simeon's count dropped from **59,300 to 22,200** — a loss of 37,100 men, a **63% decline**. No other tribe came close to this collapse. The connection to the Baal Peor plague is unmistakable: Simeon's prince led the apostasy, and Simeon bore the heaviest losses.

        </div>
        </details>

        <details class="tribe-section">
        <summary>From Cursing to Silence</summary>
        <div>

        **Jacob's Curse (Genesis 49:5–7):** Simeon shares Levi's condemnation: "Simeon and Levi are brethren; instruments of cruelty are in their habitations... Cursed be their anger, for it was fierce; and their wrath, for it was cruel: I will divide them in Jacob, and scatter them in Israel." The same curse, pronounced on both brothers. Yet the outcomes could not be more different. Levi's scattering became a priestly distribution — Levitical cities throughout all Israel, teaching and ministering. Simeon's scattering became absorption and eventual disappearance.

        **Moses' Blessing (Deuteronomy 33):** Simeon is the only tribe that receives **no individual blessing** from Moses. The silence is conspicuous. Every other tribe — even diminished Reuben — receives at least a brief word. Simeon receives nothing. Some scholars suggest Simeon may be implicitly included under Judah's blessing, since Simeon's territory lay entirely within Judah's borders (Joshua 19:1–9). Others see the omission as a reflection of the tribe's standing after the Zimri catastrophe. Either way, Moses' silence speaks volumes.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Tribe</summary>
        <div>

        **Census:** 59,300 men at the first census (Numbers 1:23); 22,200 at the second (Numbers 26:14). The largest decline of any tribe.

        **Banner — Two Traditions:**
        - **Breastplate (birth-order tradition):** *pitdah* (פִּטְדָה), rendered as yellow-green. The banner artwork in this field guide uses this color.
        - **Bamidbar Rabbah 2:7:** also *pitdah*, with a green flag bearing the image of the city of Shechem.

        **Historical Role:** Simeon's tribal territory was an enclave entirely within Judah's borders (Joshua 19:1–9) — not a separate region but a pocket within another tribe's land. Over time, Simeon's distinct identity faded as the tribe was absorbed into Judah. Some Simeonite clans migrated to other areas (1 Chronicles 4:38–43), but the tribe produced no notable judge, prophet, or king. Simeon stands as the starkest example in the tribal narrative of how a patriarch's choices — and a tribe's subsequent failures — could shape a people's trajectory for generations.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Contrast with Levi</summary>
        <div>

        Simeon and Levi received the same curse from Jacob. Both were scattered. But Levi was redeemed through faithfulness at Sinai — "Who is on the Lord's side?" — while Simeon was further diminished through unfaithfulness at Baal Peor. The difference was not in the curse but in what each tribe did with it. Levi's fierce energy was redirected toward God; Simeon's was directed toward apostasy. The same raw material — zeal, intensity, willingness to act — produced a priestly tribe in one case and a vanishing tribe in the other. The variable was faithfulness.

        </div>
        </details>

        <details class="tribe-section" open>
        <summary>Gathering of Israel</summary>
        <div>

        Simeon's name means "hearing" — God heard Leah's affliction. Even a tribe whose identity was absorbed, whose blessing was passed over in silence, whose prince led the worst apostasy in the wilderness, was *heard* by God at its origin. In the Gathering, Simeon's story speaks to those who feel invisible, overlooked, or swallowed up by larger forces. It speaks to those whose family or community has made devastating choices. The God who heard Leah's tears does not forget His covenant with any of Israel's children, no matter how scattered or diminished they appear.

        And here is the extraordinary thing: Simeon is still listed among the twelve in Revelation 7:7. The tribe disappeared from the map — absorbed into Judah, its territory swallowed, its distinct identity seemingly erased. By any human measure, Simeon was gone. But God's accounting is not ours. In the final sealing, when John sees the twelve tribes sealed for the last days, Simeon is named. Not forgotten. Not replaced. Not written off. God is still anticipating a remnant from this tribe. He reserved a place for Simeon long after the world assumed there was nothing left to gather.

        That is the hope Simeon offers. A tribe can vanish from history and still be known to God. A people can be scattered beyond recognition and still be called home. The gathering is not limited to those whose identity survived intact — it reaches into the places where identity was lost, where lineage was forgotten, where the thread seemed to have been cut entirely. God keeps the list. And Simeon is on it.

        </div>
        </details>

