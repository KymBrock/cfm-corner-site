        ### יְהוּדָה — "Praise"

        **Mother:** Leah | **Birth Sequence:** 4th son of Jacob (Genesis 29:35)

        <details class="tribe-section" open>
        <summary>The Brother</summary>
        <div>

        Judah was the fourth son of Jacob and Leah. At his birth, Leah declared, "Now will I praise the LORD" (Genesis 29:35). The name *Yehudah* (יְהוּדָה) contains the divine name — the root *yadah* (יָדָה), "to praise" or "to give thanks," wrapped around the letters of YHWH. With Judah, Leah moved beyond longing for her husband's love and turned wholly to praising God. That shift of heart became embedded in Judah's very name and in his tribe's mission.

        The man who bore that name, however, had to grow into it. Judah's early story is marked by failure. He proposed selling Joseph into slavery rather than killing him (Genesis 37:26–27) — an act that preserved Joseph's life but was still treacherous. He then departed from his brothers and married a Canaanite woman, fathering three sons: Er, Onan, and Shelah. When Er and Onan died, Judah withheld his youngest son Shelah from his daughter-in-law Tamar, breaking the obligation of levirate marriage and leaving her in a state of permanent widowhood (Genesis 38:11–14).

        </div>
        </details>

        <details class="tribe-section">
        <summary>Judah and Tamar</summary>
        <div>

        Tamar's response exposed Judah's hypocrisy. Disguising herself, she positioned herself where Judah would find her and conceived by him. When Judah later discovered she was pregnant and condemned her to death, Tamar produced his own signet, cord, and staff as evidence: "Discern, I pray thee, whose are these" (Genesis 38:25). Judah's response was the turning point of his life: "She hath been more righteous than I" (Genesis 38:26). In that moment of honest self-reckoning — acknowledging his own failure publicly — Judah began to become the leader his name promised. From this union came Perez, who "burst forth" first (*parotz*, פָּרַץ), becoming the ancestor of David and ultimately of Jesus Christ. The messianic line runs through Judah's most humbling chapter.

        </div>
        </details>

        <details class="tribe-section">
        <summary>Judah as Surety</summary>
        <div>

        By the time of the famine in Egypt, Judah had been transformed. When Jacob refused to send Benjamin, it was Judah — not Reuben the firstborn — who stepped forward with a surety offer that staked his own standing: "I will be surety for him; of my hand shalt thou require him: if I bring him not unto thee, and set him before thee, then let me bear the blame for ever" (Genesis 43:9). Reuben had offered to have his own two sons killed if he failed (Genesis 42:37) — a gesture Rabbi David Kimhi paraphrased as Jacob thinking, "Stupid firstborn! Are they your sons and not my sons?" Judah offered *himself*.

        His plea before Joseph (Genesis 44:18–34) — the longest speech in Genesis — is the speech that broke Joseph's composure. Judah offered to become a slave in Benjamin's place so that his father would not die of grief. The brother who once sold Joseph into slavery now offered to become a slave himself to save another brother. Joseph recognized in Judah's plea the proof that the brothers had truly changed (IF KnoWhy OTL11A). From the one who sold a brother came the one who would give himself for a brother — a type of the Messiah who would descend from Judah's line.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Blessings</summary>
        <div>

        **Jacob's Blessing (Genesis 49:8–12):** "Judah, thou art he whom thy brethren shall praise: thy hand shall be in the neck of thine enemies; thy father's children shall bow down before thee. Judah is a lion's whelp: from the prey, my son, thou art gone up: he stooped down, he couched as a lion, and as an old lion; who shall rouse him up? The sceptre shall not depart from Judah, nor a lawgiver from between his feet, until Shiloh come; and unto him shall the gathering of the people be."

        This is the most expansive and messianic of all the tribal blessings. It contains three layers:

        - **The Lion** (Genesis 49:9) — Judah as a young lion seizing prey, returning to its den, daring anyone to challenge it. This image foreshadows the military triumphs of David and gave rise to the enduring messianic title "The Lion of Judah" (Revelation 5:5).
        - **The Sceptre** (Genesis 49:10) — Judah receives the kingship. The royal line of Israel — David, Solomon, and ultimately the Messiah — would come from this tribe. This is the sceptre that 1 Chronicles 5:2 distinguishes from the birthright: "Judah prevailed above his brethren, and of him came the chief ruler; but the birthright was Joseph's."
        - **Until Shiloh Come** (Genesis 49:10) — The most debated phrase in the blessing. The JST clarifies: "Messiah ... is called Shilo" (JST Genesis 50:24). Qumran texts, Targums, and rabbinic tradition all support a messianic reading. "Unto him shall the gathering of the people be" — the ultimate gathering belongs to the Messiah from Judah's line ([KnoWhy OTL12A](https://interpreterfoundation.org/knowhy-otl12a/)).

        **Moses' Blessing (Deuteronomy 33:7):** "Hear, LORD, the voice of Judah, and bring him unto his people: let his hands be sufficient for him; and be thou an help to him from his enemies." Notably brief for such a prominent tribe. It reads as a prayer that Judah be reunited with his brethren — a prophetic note that anticipates the division of the kingdom and the long centuries of Judah's scattering before the eventual regathering.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Two Messiahs</summary>
        <div>

        The deliberate separation of the sceptre (Judah) from the birthright (Joseph) generated one of the most significant theological concepts in Jewish messianic thought: the expectation of two messianic figures.

        - **Mashiach ben David** (from Judah) — the king, the ruler, the one who comes in glory to reign on David's throne.
        - **Mashiach ben Joseph** (from Joseph/Ephraim) — the suffering servant, the one who is rejected, who dies, and who is mourned before the final redemption. Zechariah 12:10's mourning for "him whom they pierced" is traditionally associated with Mashiach ben Joseph in rabbinic literature.

        Latter-day Saints recognize that both roles were fulfilled in Jesus Christ — the suffering servant foreshadowed by Joseph's type, and the King of David's throne. Judah's blessing points to the kingly Messiah; Joseph's blessing points to the gathering Messiah. Both converge in Christ (Week 11 Historical-Cultural Context study guide).

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Tribe</summary>
        <div>

        **Census:** 74,600 men — the largest individual tribe. Led the eastern camp, directly before the gate of the Tabernacle courtyard, the first camp to face the entrance where the presence of God dwelt. First to march when Israel traveled (Numbers 10:14).

        **Banner — Two Traditions:**
        - **Breastplate (birth-order tradition):** *nofekh* (נֹפֶךְ), rendered as teal. The banner artwork in this field guide uses this color.
        - **Bamidbar Rabbah 2:7:** also *nofekh*, but describes the banner as "the color of the heavens" (sky blue), bearing the image of a lion (Genesis 49:9).

        **Historical Role:** From Judah came the royal line of Israel. David was anointed king from Judah's descendants, and the promise of an eternal throne (2 Samuel 7:12–16) — the Davidic Covenant — pointed through David's lineage to Jesus Christ. After the kingdom divided (c. 930 BC), the southern kingdom retained the name "Judah" and included the tribes of Judah and Benjamin, along with many Levites. When the northern tribes were carried away by Assyria, Judah endured — and after the Babylonian exile, it was Judah that returned to rebuild Jerusalem and the temple. The word "Jew" (*Yehudi*, יְהוּדִי) derives from Judah; the Jewish people who preserved Torah, temple worship, and covenant identity through millennia of exile carry the name and mission of this tribe.

        </div>
        </details>

        <details class="tribe-section" open>
        <summary>Gathering of Israel</summary>
        <div>

        The gathering of Judah is one of the most visible prophetic fulfillments in modern history. The return of the Jewish people to the land of Israel, the preservation of Hebrew as a living language, and the survival of covenant identity through nearly two thousand years of dispersion all witness to Jacob's blessing that "the sceptre shall not depart from Judah."

        In Latter-day Saint understanding, the full gathering of Judah includes not only a physical return to the land but a future recognition of the Messiah. Zechariah prophesied that moment: "And one shall say unto him, What are these wounds in thine hands? Then he shall answer, Those with which I was wounded in the house of my friends" (Zechariah 13:6). The Doctrine and Covenants records the same scene: "and then shall the Jews look upon me and say: What are these wounds in thine hands and in thy feet? ... and then shall they know that I am the Lord" (D&C 45:51–52).

        The word that matters most in Zechariah's prophecy is **friends**. Jesus does not call the Jewish people His enemies. He calls them His friends. The wounds He bears are not presented as an accusation but as an identification — *this is who I am, and you have always been mine*. The moment is one of reunion, not blame.

        The Book of Mormon is direct and forceful on this point. Nephi rebukes any Gentile who would despise the Jews: "O ye Gentiles, have ye remembered the Jews, mine ancient covenant people? Nay; but ye have cursed them, and have hated them, and have not sought to recover them. But behold, I will return all these things upon your own heads; for I the Lord have not forgotten my people" (2 Nephi 29:5). He also asks: "And what thank the Gentiles the Jews for the Bible which they receive from them?" (2 Nephi 29:4). The Bible — the record of God's dealings with humanity, the scripture that carries the testimony of Christ — came through the Jewish people. Latter-day Saints owe an immeasurable debt of gratitude to Judah.

        No member of the Church of Jesus Christ of Latter-day Saints should be guilty of anti-Semitism. Our doctrine is not ambiguous on this point. The Jewish people are God's "ancient covenant people." Their preservation through millennia of dispersion is itself a witness that God keeps His word. Their future recognition of the Messiah is not a moment of defeat but of homecoming — the Lion of their own tribe, wounded in the house of His friends, embracing the people He never abandoned.

        Judah's mission in the Gathering is to witness that God keeps His covenants across all generations. And the rest of Israel's mission toward Judah is gratitude, respect, and the faithful hope that when the moment of recognition comes, it will be what Zechariah described: not judgment, but a joyful reunion.

        </div>
        </details>

    - id: issachar
      title: "Issachar"
      group: "East — Camp of Judah (186,400)"
