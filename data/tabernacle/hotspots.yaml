        The *masakh ha-petach* (מָסָךְ הַפֶּתַח) — a screen of blue, purple, scarlet, and fine linen — hung on five gold-overlaid acacia pillars with bronze bases (Ex 26:36-37). This was the transition from courtyard to priestly space. Only priests entered here to carry out the daily service of the sanctuary.
        
        The entrance screen stood on bronze bases (like the outer gate) while its pillars wore gold (like the inner furnishings). It was a threshold between two worlds — the bronze zone of approach and the gold zone of priestly service.
      deep_dive: |
        ### Three Thresholds
        
        The Tabernacle had three woven thresholds, each marking a deeper level of access. The colors were the same at every threshold. What changed: the number of pillars, the base metal, the textile technique, who could pass through, and whether cherubim were present.
        
        | Threshold | Pillars | Bases | Technique | Cherubim | Access |
        |-----------|---------|-------|-----------|----------|--------|
        | **Outer Gate** | 4 | Bronze | *roqem* (רֹקֵם) — needlework | No | All Israelites |
        | **Tent Entrance** | 5 | Bronze (gold-overlaid pillars) | *roqem* (רֹקֵם) — needlework | No | Priests only |
        | **Inner Veil** | 4 | Silver | *choshev* (חֹשֵׁב) — skillful work | **Yes** | High Priest, Yom Kippur |
        
        The tent entrance is the most striking transition point in the metal gradient: gold-overlaid pillars standing on bronze bases. The priest crosses from the bronze world into the gold world through pillars that are both at once — gold on top, bronze below. The threshold itself is a visual statement about where approach becomes service, where the outer zone yields to the inner.
        
        The colors remain the same at every threshold — blue, purple, scarlet, fine linen. What changes: the number of pillars, the base metal, the technique of weaving, and who may pass through. Each boundary narrows access and intensifies holiness. The Tabernacle teaches through thresholds — each passage inward is a passage deeper into God's ordered holiness.
        
        ### The Rhythm of Daily Crossing
        
        The priests entered this screen twice daily — morning and evening — to tend the Menorah lamps, burn incense, and maintain the bread of the Presence (Ex 30:7-8). This was not an occasional, dramatic entry. It was a daily rhythm of in-and-out, morning and evening — the priestly equivalent of the daily office. The tent entrance was the doorway of sustained, relational ministry.
