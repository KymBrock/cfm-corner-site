        - title: "Understanding the Day of Atonement / Yom Kippur"
          youtube_id: "4UYT-0AmlnA"
          embed_url: "https://www.youtube.com/embed/4UYT-0AmlnA"
      x: 18
      y: 31
      copy: |
        The *parokhet* (פָּרֹכֶת) — the inner veil — separated the Holy Place from the Most Holy Place (Ex 26:31-33). It was woven from the same four materials found throughout the Tabernacle: blue (*tekhelet*, תְּכֵלֶת), purple (*argaman*, אַרְגָּמָן), scarlet (*tola'at shani*, תּוֹלַעַת שָׁנִי), and fine linen (*shesh*, שֵׁשׁ). Cherubim were worked into the fabric — the same guardians who stood at Eden's gate (Gen 3:24) now woven into the boundary between human approach and divine presence.
        
        It hung on four gold-overlaid acacia pillars set in silver bases. Only the High Priest could pass through it, and only once a year, on the Day of Atonement.
        
        The veil was the most theologically charged textile in Israel's worship.
      deep_dive: |
        ### The Fabric Cosmos
        
        The veil was *ma'aseh choshev* (מַעֲשֵׂה חֹשֵׁב) — skillful designer work with cherubim woven into the fabric. This is the highest textile technique in the Tabernacle, the same used for the innermost linen curtains. The outer screens — the courtyard gate and the tent entrance — used simpler *roqem* (רֹקֵם) needlework and bore no cherubim. The cherubim appear only at the deepest boundaries. The technique escalates as one moves inward.
        
        Josephus read every textile in the Tabernacle — veils, curtains, garments — as representing the four elements of creation: "The fine linen was proper to signify the earth, because the flax grows out of the earth; the purple signified the sea, because that color is dyed by the blood of a sea shell-fish; the blue is fit to signify the air; and the scarlet will naturally be an indication of fire" (*Antiquities* 3.7.7).
        
        The inner veil was woven from these same four materials. To pass through the *parokhet* was, in Josephus' reading, to pass through the woven fabric of the created order toward the Creator who dwells behind it. The priest did not merely cross a curtain. He crossed the cosmos.
        
        **Note:** Josephus' elemental reading applies to the entire Tabernacle textile system, not to the inner veil alone. The same four materials appear in the outer gate screen, the entrance screen, the curtains, and the priestly garments. The veil is one expression of a consistent symbolic pattern.
        
        ### Eden's Gate Opened
        
        Cherubim appear in three places in the Tabernacle's design, and the progression tells a story:
        
        1. **Eden** (Gen 3:24) — cherubim guard *against* approach. The way to the Tree of Life is blocked.
        2. **The Veil** (Ex 26:31) — cherubim are woven *into the fabric of approach*. The way is guarded but passable — once a year, by one man, with blood.
        3. **The Mercy Seat** (Ex 25:18-20) — cherubim *frame the meeting point*. Their wings overshadow the place where God speaks.
        
        The movement is from exclusion to mediated access to invitation. The cherubim that once stood between humanity and God now accompany the worshiper from the outer boundary to the inner meeting. The veil is the middle point of that journey — the boundary that can be crossed.
        
        ### Four Pillars, Silver Bases
        
        The inner veil hung on four pillars with silver bases (Ex 26:32). The entrance screen hung on five pillars with bronze bases (Ex 26:37). The outer gate hung on four pillars with bronze bases (Ex 27:16). The inner veil is the only threshold standing on silver — the metal of redemption, cast from the census ransom money. Bronze at the outer gate, bronze at the tent entrance, silver at the deepest boundary. Each step inward: fewer supports, more precious foundations.
        
        The number four in the Tabernacle consistently marks the created order: four colors, four elements in Josephus' reading, four covering layers, four rows of breastplate stones. The veil, hanging on four pillars, is the fabric edge of creation. What lies beyond it is not the created order but the Creator.
        
        The pillar counts and base metals are in the biblical text. The reading of four as creation's boundary is a pattern observed across the Tabernacle's recurring use of four — suggestive, not stated.
        
        ### The Veil Torn
        
        At Christ's crucifixion, "the veil of the temple was rent in twain from the top to the bottom" (Matt 27:51; Mark 15:38). The direction matters. The tear began at the top, not the bottom. This was not human effort reaching upward. It was divine initiative reaching down. God tore the barrier.
        
        Hebrews gives the interpretation: "Having therefore, brethren, boldness to enter into the holiest by the blood of Jesus, by a new and living way, which he hath consecrated for us, through the veil, that is to say, his flesh" (Heb 10:19-20). The veil is identified with Christ's body. His flesh was the boundary between God and humanity, and through His sacrifice that boundary was opened — not destroyed but consecrated into "a new and living way."
        
        The torn veil means the way is open. It does not mean the way is trivial. Access and reverence are not opposites. The barrier was removed so that approach could become permanent, not so that holiness could become casual.
        
        ### The Anchor Behind the Veil
        
        "Which hope we have as an anchor of the soul, both sure and stedfast, and which entereth into that within the veil; whither the forerunner is for us entered, even Jesus, made an high priest for ever after the order of Melchisedec." (Heb 6:19-20)
        
        Christ has already gone behind the veil. He is not waiting outside with us. He is already inside, and He has anchored our hope there — in the place where the Ark rests, where the Mercy Seat covers the Law, where God's presence dwells. The anchor is behind the veil. That is where our hope is secured.
        
        ### The Veil Swallowed Up
        
        Isaiah prophesied a day when the veil would not simply be torn but consumed entirely: "He will destroy in this mountain the face of the covering cast over all people, and the vail that is spread over all nations. He will swallow up death in victory; and the Lord GOD will wipe away tears from off all faces" (Isa 25:7-8). The veil is not just a Tabernacle textile — it is a condition of mortality, a covering spread over all people. And the promise is that it will be swallowed up along with death itself. Paul quotes this passage at the climax of his resurrection chapter: "Death is swallowed up in victory" (1 Cor 15:54). The veil torn at the crucifixion, the veil removed in the temple, and the veil swallowed up at the resurrection are three acts in one drama — the boundary between God and humanity progressively and permanently opened.
