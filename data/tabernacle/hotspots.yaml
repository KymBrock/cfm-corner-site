        ### גָּד — "Fortune" / "A Troop"

        **Mother:** Zilpah (Leah's handmaid) | **Birth Sequence:** 7th son of Jacob (Genesis 30:11)

        <details class="tribe-section" open>
        <summary>The Brother</summary>
        <div>

        Gad was the seventh son of Jacob, the first son of Zilpah, Leah's handmaid. At his birth, Leah said, "A troop cometh" (Genesis 30:11), or in some readings, "Good fortune!" The name *Gad* (גָּד) carries the dual sense of *fortune* and *troop* or *raiding band* — both meanings shape the tribe's identity. Gad has no personal narrative in Genesis beyond his birth. His story is written not in the patriarchal account but in the centuries that followed, as the tribe that bore his name lived out the warrior blessing their father pronounced.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Blessings</summary>
        <div>

        **Jacob's Blessing (Genesis 49:19):** "Gad, a troop shall overcome him: but he shall overcome at the last."

        The Hebrew is one of the most striking examples of wordplay in all of Genesis — *Gad gedud yegudennu, vehu yagud aqev* (גָּד גְּדוּד יְגוּדֶנּוּ וְהוּא יָגֻד עָקֵב) — stacking the root *g-d-d* (גדד) five times in a single verse. The sound itself hammers like marching boots: *Gad, gedud, yegudennu, yagud, aqev*. Gad will be pressed, raided, and overcome — but will rally, pursue, and overcome at the last. This is a warrior's blessing, a promise of resilience under repeated assault. The final word, *aqev* (עָקֵב), "at the heel," suggests that Gad strikes back at the retreating enemy — he doesn't just endure; he pursues.

        **Moses' Blessing (Deuteronomy 33:20–21):** "Blessed be he that enlargeth Gad: he dwelleth as a lion, and teareth the arm with the crown of the head. And he provided the first part for himself, because there, in a portion of the lawgiver, was he seated; and he came with the heads of the people, he executed the justice of the LORD, and his judgments with Israel."

        Moses expands Gad's identity beyond raiding: Gad dwells "as a lion" (military strength), claims the first portion east of the Jordan, and yet faithfully crosses over to fight with his brothers. The blessing honors both Gad's warrior courage and his covenant loyalty — he took the best land for himself *and* still showed up when Israel needed him.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Tribe of Elijah</summary>
        <div>

        Bereishit Rabbah 99:7 (on Genesis 49:19) preserves a remarkable tradition: it identifies **Elijah the prophet as from the tribe of Gad**. The midrash connects Gad's blessing to Malachi 3:23 — "Behold, I will send you Elijah the prophet before the coming of the great and dreadful day of the LORD" — and declares that the redemption will come through Gad, through Elijah.

        This identification transforms Gad's warrior blessing into something messianic. The tribe that "shall overcome at the last" produces the prophet who prepares the way for the Messiah's coming. Elijah himself is introduced in Scripture as "the Tishbite, who was of the inhabitants of Gilead" (1 Kings 17:1) — and Gilead is Gad's territory. The prophet who stood alone on Mount Carmel against 450 prophets of Baal, who called fire down from heaven, who was fed by ravens in the wilderness — this was a Gadite. The fierce, relentless, never-give-up energy of Gad's blessing found its ultimate expression in Elijah.

        </div>
        </details>

        <details class="tribe-section">
        <summary>The Tribe</summary>
        <div>

        **Census:** 45,650 men under Reuben's standard in the southern camp.

        **Banner — Two Traditions:**
        - **Breastplate (birth-order tradition):** *leshem* (לֶשֶׁם), rendered as pink. The banner artwork in this field guide uses this color.
        - **Bamidbar Rabbah 2:7:** assigns *shevo* (not *leshem*) and describes the flag as grey (mixed black and white) bearing a military camp.

        **Historical Role:** Gad settled east of the Jordan in the region of Gilead (Numbers 32), prime territory that was also dangerously exposed to constant raids from Ammonites, Moabites, and Arameans. True to Jacob's blessing, Gad endured repeated incursions but fought back fiercely. The Gadites were celebrated warriors — 1 Chronicles 12:8 describes Gadite soldiers who came to David as men "whose faces were like the faces of lions, and were as swift as the roes upon the mountains." These were men who crossed the Jordan at flood stage to join David's cause — the kind of warriors who didn't wait for convenient conditions.

        **Archaeological Confirmation:** The Mesha Stele (Moabite Stone, c. 840 BC), discovered in 1868 at Dhiban, Jordan, and now in the Louvre, provides one of the few extra-biblical attestations of a specific Israelite tribe. The inscription records King Mesha of Moab's rebellion against Israel and states: "The men of Gad dwelled in the country of Ataroth from ancient times." A pagan king's war memorial confirms what Numbers 32 and Joshua 13 record — Gad held the Transjordan, and Israel's enemies knew them by name.

        </div>
        </details>

        <details class="tribe-section" open>
        <summary>Gathering of Israel</summary>
        <div>

        Gad embodies the promise that those who are overcome will overcome at the last. In the Gathering of Israel — a work that spans centuries of scattering, persecution, and loss — Gad's blessing is a covenant of final victory. The troops may be pressed, the raiding may be relentless, but the end is triumph. For those who feel battered by opposition in covenant life, Gad's banner promises that endurance will prevail.

        And from Gad came Elijah — the prophet who returns before the great day of the Lord, the one who turns the hearts of the fathers to the children (Malachi 4:5–6). In Latter-day Saint understanding, Elijah's return to the Kirtland Temple on April 3, 1836 (D&C 110:13–16) restored the sealing power that binds families across generations. The warrior tribe's ultimate contribution to the Gathering is not a military victory but a family reunion — the sealing of all Israel, past and present, into one covenant people.

        </div>
        </details>

    # ── WEST: CAMP OF EPHRAIM (108,100) ──
