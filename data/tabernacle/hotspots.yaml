      copy: |
        The *masakh* (מָסָךְ) — 20 cubits wide (~30 feet), 5 cubits high, woven in blue, purple, scarlet, and fine linen — was the single entrance into the Tabernacle court (Ex 27:16; 38:18). It hung on four pillars with bronze bases. It was not a door with hinges or a fortified gate with towers. It was a screen — a woven covering that could be drawn aside to permit approach.
        
        The root *sakhakh* (סכך) means "to cover, to screen, to hedge." It is the same root that gives us *sukkah* (סֻכָּה) — the temporary shelter of *Sukkot* (סֻכּוֹת), the Feast of Tabernacles. The entrance to God's dwelling and the festival that remembers His dwelling share the same root.
      deep_dive: |
        ### Facing East — Walking Toward Eden
        
        The gate opened on the east side of the courtyard (Ex 27:13-16). A worshiper entering moved westward — toward God's presence. After the Fall, Adam and Eve were sent eastward from Eden (Gen 3:24). The Tabernacle journey reverses the direction of the Fall: entering through the eastern gate and moving west is a symbolic return toward the garden, toward the tree guarded by cherubim, toward the presence of God.
        
        The worshiper's westward path also follows the path of the sun. The sun rises in the east and crosses the sky toward the west — and the worshiper entering the gate walks in the same direction, tracing the arc of the day as they move toward the place where God's presence dwells. Inside the sanctuary, the Menorah burns with a light that transcends the sun — not because the sun fails to reach that far, but because the deeper one moves into God's presence, the less the natural world's light is needed. The journey from the eastern gate to the Holy Place moves from the realm of natural light into the realm of consecrated light, following the sun's path until a greater light takes its place.
        
        No cherubim appear at the outer gate — the approach begins without them. But as the worshiper moves deeper inward, cherubim emerge at the innermost boundaries: woven into the ceiling curtains (Ex 26:1), woven into the inner veil (Ex 26:31), and standing in gold atop the Mercy Seat (Ex 25:18-20). In Eden, cherubim blocked the way back to God's presence (Gen 3:24). In the Tabernacle, the worshiper who enters the eastern gate and walks westward encounters them again — not at the entrance but at the destination, no longer blocking the way but framing the place where God speaks.
        
        **Source note:** The gate's eastern placement is biblical. The directional-reversal reading and the solar-path observation are widely attested in both Jewish and Christian commentary. They are not explicit in Exodus but are grounded in scriptural geography and the sanctuary's design.
        
        ### The White Linen Fence
        
        The courtyard fence was white fine linen, 5 cubits high (~7.5 feet), hung on 60 bronze-based pillars with silver hooks and bands (Ex 27:9-18). Above eye level — the interior was not visible from outside. The only way to see inside was to enter.
        
        The white linen stood in contrast to the ordinary goat-hair tents of the camp. Revelation identifies the fabric: "Fine linen is the righteousness of saints" (Rev 19:8). The boundary between ordinary camp and sacred court was made of the same material the priests wore. The fence declared: inside is sacred, set apart, different.
        
        ### One Gate — One Way
        
        The Tabernacle had one entrance. There was no side door, no back passage. Every worshiper entered by the same gate on the same side.
        
        The Psalmist sang of this entrance: "Open to me the gates of righteousness: I will go into them, and I will praise the LORD: this gate of the LORD, into which the righteous shall enter" (Ps 118:19-20). The gate is not merely an opening — it is the LORD's gate, and entering it is an act of praise.
        
        Jesus drew on this directly: "I am the door: by me if any man enter in, he shall be saved, and shall go in and out, and find pasture" (John 10:9). The single entrance becomes, in the New Testament, a Christological claim: one way in, and that way is a person.
        
        ### The Four Colors
        
        The gate screen used the same four sacred colors found on every textile boundary in the Tabernacle: blue (*tekhelet*, תְּכֵלֶת), purple (*argaman*, אַרְגָּמָן), scarlet (*tola'at shani*, תּוֹלַעַת שָׁנִי), and fine white linen (*shesh*, שֵׁשׁ). These four colors appear together at the outer gate, the tent entrance, the inner veil, the ceiling curtains, and the priestly garments — a visual vocabulary that begins the moment the worshiper first sees the sanctuary and repeats at every threshold inward. They are worth understanding, because you will see them throughout this field guide.
        
        **Blue — *tekhelet* (תְּכֵלֶת).** A blue-violet dye extracted from a marine snail — most likely the banded dye-murex (*Hexaplex trunculus*), found along the eastern Mediterranean coast. The shellfish dye industry is ancient — murex shell middens at Minoan sites on Crete date to the 18th-17th centuries BCE, well before the Phoenicians emerged as a maritime culture after the Late Bronze Age collapse (~1200 BCE). The Phoenicians later inherited and expanded the trade, giving "Tyrian purple" its famous name, but the technology and the dye sources were already centuries old when Israel left Egypt. Thousands of snails were needed to produce even a small quantity of dye, making *tekhelet* one of the most precious substances in the ancient world.
        
        The Talmud (Menachot 43b) traces a chain of resemblance: *tekhelet* resembles the sea, the sea resembles the sky, the sky resembles the Throne of Glory. Blue was the color of heaven — and every Israelite was commanded to carry a thread of it in the fringes of their garment (Num 15:38-39) as a daily reminder of the commandments and of God's heavenly authority. After the Second Temple's destruction, the identity of the *tekhelet* snail was lost for nearly two millennia. In recent decades, the Ptil Tekhelet Foundation has re-identified the *Murex trunculus* and resumed production — a living recovery of an ancient practice.
        
        **Purple — *argaman* (אַרְגָּמָן).** A reddish-purple dye produced from a different species of murex snail (*Bolinus brandaris*) and the dogwinkle (*Stramonita haemastoma*). Like *tekhelet*, the purple dye industry originated in the Minoan world — archaeological evidence of murex processing appears at Cretan sites centuries before the Phoenicians made the trade their own. The name "Tyrian purple" reflects the Phoenician city that later dominated the industry, but the craft itself was a Minoan enterprise that the Phoenicians continued after the collapse of the Bronze Age Mediterranean. The dye was so costly that it became synonymous with royalty throughout the ancient world. Roman senators wore purple-bordered togas; emperors wore full purple; in some periods, unauthorized wearing of purple was a criminal offense. In the Tabernacle, purple represents royalty and the meeting of heaven and earth — the blend of blue (sky) and scarlet (blood/earth), the bridging color. Josephus connects the color to the sea: "The purple signified the sea, because that color is dyed by the blood of a sea shell-fish" (*Antiquities* 3.7.7).
        
        **Scarlet — *tola'at shani* (תּוֹלַעַת שָׁנִי).** Literally "scarlet worm" or "crimson of the worm." The dye came from the crushed bodies of the female kermes insect (*Kermes vermilio*), a scale insect harvested from Mediterranean oak trees. The name itself carries theological resonance: the Psalmist writes, "I am a worm (*tola'at*), and no man" (Ps 22:6) — a psalm applied to Christ on the cross. Isaiah uses the same root: "Though your sins be as scarlet (*shanim*), they shall be as white as snow" (Isa 1:18). The scarlet dye came from a crushed creature — a life given, a body broken, to produce the color of blood and sacrifice. Josephus reads scarlet as fire: "The scarlet will naturally be an indication of fire" (*Antiquities* 3.7.7).
        
        **White — *shesh* (שֵׁשׁ).** Fine twisted linen — the base fabric on which the other three colors were woven. Edersheim identifies the priestly linen as *byssus*, the white shining cotton-stuff of Egypt, and connects it to Revelation 19:8: "The fine linen is the righteousness of saints." White linen was the ground of every Tabernacle textile and the foundation garment of every priest. Josephus reads linen as earth: "The fine linen was proper to signify the earth, because the flax grows out of the earth" (*Antiquities* 3.7.7). White is the foundation — the created ground from which the sacred colors rise.
        
        **Together** — Josephus reads the four materials as the four elements of creation: linen = earth, purple = sea, blue = air, scarlet = fire. Every curtain, screen, veil, and priestly garment was woven from the fabric of the cosmos. To pass through a Tabernacle threshold was to pass through the woven elements of the created world toward the Creator who dwells behind them.
        
        The colors were the same at every threshold, but the technique was not. The gate screen was *ma'aseh roqem* (מַעֲשֵׂה רֹקֵם) — embroidered needlework, the simpler of the two sacred textile techniques. No cherubim adorned this outer threshold. The cherubim appear only deeper in — woven into the innermost linen curtains and the inner veil by *choshev* (חֹשֵׁב), the higher skillful-design technique. The Tabernacle teaches through escalating craftsmanship: the same sacred colors, but richer and more complex work as one moves inward.
    - id: outer-court
      title: "Outer Court"
      tooltip: "The zone of approach surrounding the tent."
      scripture: "Ex 27:9-19; Ex 38:9-20"
      translit: "chatzer"
      hebrew: "חָצֵר"
      image: "/images/tabernacle/arch-tabernacle-court-wall-section-plain.png"
      videos:
        - title: "Finding Christ in the Gate and Courtyard"
          youtube_id: "9opTZb54IA8"
          embed_url: "https://www.youtube.com/embed/9opTZb54IA8"
      x: 60
      y: 53
      copy: |
        The *chatzer* (חָצֵר) measured 100 × 50 cubits (~150 × 75 feet), enclosed by white linen hangings 5 cubits high on 60 bronze-based pillars (Ex 27:9-19). This was the zone of approach — the only area accessible to ordinary Israelites bringing offerings. Everything here was bronze: the altar, the laver, the pillar bases, the gate sockets. Bronze is the metal of fire and judgment, the material of the zone where sacrifice burns and cleansing begins.
      deep_dive: |
        ### The Bronze Zone
        
        The courtyard was defined by its metal. Gold belonged to the Holy Place and the Holy of Holies. Bronze belonged here — the altar of sacrifice, the laver of washing, the pillar bases, the gate fittings. Bronze withstands fire. It is the metal of the zone where fire burns, blood is poured, and the hardest work of worship takes place.
        
        The brazen altar and the laver stood in this court, marking its two essential functions: sacrifice and cleansing. No worshiper could pass beyond without both. Approach begins with offering; it is sustained by purification.
        
        ### White Walls, One Gate
        
        The fine white linen fence stood in stark contrast to the dark goat-hair tents of the camp — a visible declaration of sacred space set apart. At 5 cubits (~7.5 feet), the fence was above eye level. The interior was invisible from outside. The only way to see what was within was to enter through the single gate on the east side.
        
        The courtyard was, by design, a space that could not be observed from a distance. It had to be entered to be known.
        
        ### Graduated Approach
        
        The Tabernacle taught through graduated zones. The courtyard was the outermost — open to all Israelites who came with offerings. Beyond it, the Holy Place admitted only priests for daily service. Beyond that, the Holy of Holies admitted only the High Priest, once a year, with blood and incense.
        
        Each threshold narrowed access and intensified holiness. The worshiper's physical journey inward was a journey upward — from earth toward heaven, from the bronze zone through the gold zone toward the place where God's glory dwelled behind the veil.
        
        Latter-day Saint theology understands this graduated structure as reflecting the three degrees of glory revealed in Doctrine and Covenants 76: the courtyard corresponds to the telestial kingdom, the Holy Place to the terrestrial, and the Holy of Holies to the celestial — the immediate presence of God. This is the doctrinal framework that the temple itself teaches, and it gives the Tabernacle's spatial design a covenant depth that extends far beyond its ancient setting.
        
        ### Women in the Courtyard
        
        Women were active participants in the Tabernacle's life. They contributed materials for its construction — spinning yarn, weaving fabric, and donating their bronze mirrors for the laver (Ex 35:25-26; 38:8). They served at the entrance of the Tent of Meeting (Ex 38:8; 1 Sam 2:22). They brought offerings, including the purification offering after childbirth (Lev 12:6-8 — the offering Mary brought, Luke 2:22-24). They participated in the festivals alongside the men (Deut 16:11, 14).
        
        The access restrictions in the Tabernacle text are structured by holiness zones and priestly lineage — priests entered the Holy Place, the High Priest alone entered the Holy of Holies — but the courtyard restrictions are not gendered. The text does not bar women from the courtyard where offerings were brought. The separate Court of Women is a feature of Herod's Temple, not of the wilderness Tabernacle. The gender-separated architecture belongs to a later period.
