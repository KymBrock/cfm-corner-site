      translit: "mizbach ha-olah"
      hebrew: "מִזְבַּח הָעֹלָה"
      marker_image: "/images/tabernacle/mapicon-brazen-altar.png"
      image: "/images/tabernacle/artifact-brazen-altar-front.png"
      videos:
        - title: "Finding Christ in the Altar of Sacrifice"
          youtube_id: "-c5uWzQfILg"
          embed_url: "https://www.youtube.com/embed/-c5uWzQfILg"
      x: 75
      y: 39
      copy: |
        The *mizbach ha-olah* (מִזְבַּח הָעֹלָה) — the altar of burnt offering — stood in the outer court, the first major furnishing a worshiper encountered after entering the gate (Ex 27:1-8). Five cubits square, three cubits high, acacia wood overlaid with bronze, with four horns at its corners. It was hollow, not solid (Ex 27:8), likely filled with earth at each campsite. The fire on this altar never went out (Lev 6:13).
        
        The Hebrew word for offering is *korban* (קָרְבָּן), from the root *qarav* (קרב) — "to draw near." The word itself reframes what sacrifice means: not punishment, not appeasement, but approach. An offering is the act of drawing near to God. The brazen altar was the place where that approach began. Here the worshiper brought his animal, laid his hand on its head, and watched it die in his place. Blood was applied to the altar. Smoke ascended. And through that offering, the distance between the worshiper and God grew smaller.
      deep_dive: |
        ### The Life in the Blood
        
        The theological foundation of the altar is Leviticus 17:11: "For the life of the flesh is in the blood: and I have given it to you upon the altar to make an atonement for your souls: for it is the blood that maketh an atonement for the soul." Blood atones because it carries *life* — not because it represents death. God *gives* the blood for this purpose. Sacrifice at the altar is not a transaction of death but an offering of life.
        
        ### The Hand on the Head
        
        Before the animal was killed, the worshiper pressed his hand on its head — *samakh* (סָמַךְ), to lean, to press (Lev 1:4). This was not a light touch. It was a deliberate leaning — identification, transfer, solidarity. While pressing, the worshiper spoke a confession. Edersheim preserves the formula: "I entreat, O Jehovah: I have sinned, I have done perversely, I have rebelled, I have committed [naming the sin]; but I return in repentance, and let this be for my atonement (covering)" (*The Temple*, ch. 5). The hand on the head was not silent. It was accompanied by words — the worshiper naming the sin out loud and placing it, by confession, on the animal that would bear it.
        
        For individual offerings, it was the *worshiper* who killed the animal, not the priest (Lev 1:5). The priest caught the blood in a silver vessel pointed at the bottom — it could not be set down — and kept it constantly stirred to preserve its fluidity for sprinkling (Edersheim, *The Temple*, ch. 5). The killing was the offerer's act. The gravity of sacrifice was personal.
        
        The offering was made *lirtzono* (לִרְצֹנוֹ) — "of his own voluntary will" or "for his acceptance" (Lev 1:3). And through it: "it shall be accepted for him to make atonement for him" (Lev 1:4). Voluntary approach. Substitutionary death. Accepted atonement.
        
        ### A Similitude of Christ
        
        The animal on the brazen altar was first and foremost a type of Christ. The angel taught Adam the principle directly: "This thing is a similitude of the sacrifice of the Only Begotten of the Father, which is full of grace and truth" (Moses 5:7). The unblemished animal, voluntarily offered, consumed entirely by fire — this is the *olah* (עֹלָה), the offering that ascends. Christ is the ultimate *olah*: total consecration, nothing held back, not even His life. "He gave himself for us, an offering and a sacrifice to God" (Eph 5:2). The altar's primary typology points to Him.
        
        ### The Animal in Us
        
        But the altar also teaches what Christ's sacrifice asks of those who receive it. Elder Neal A. Maxwell drew the application with striking clarity:
        
        > "So it is that real, personal sacrifice never was placing an animal on the altar. Instead, it is a willingness to put the animal in us upon the altar and letting it be consumed!"
        — Elder Neal A. Maxwell, ["Deny Yourselves of All Ungodliness,"](https://www.churchofjesuschrist.org/study/general-conference/1995/04/deny-yourselves-of-all-ungodliness?lang=eng) April 1995 General Conference
        
        The *olah* consumed the entire animal — nothing was kept, nothing returned to the worshiper. When we consecrate our time, talents, and possessions to God's purposes without expectation of return, those are *olah* offerings. But what Maxwell identifies as the deepest offering is not possessions but nature — the natural man, the part of us that resists God's will and clings to self. Mosiah 3:19 names it plainly: "The natural man is an enemy to God, and has been from the fall of Adam, and will be, forever and ever, unless he yields to the enticings of the Holy Spirit, and putteth off the natural man and becometh a saint through the atonement of Christ the Lord."
        
        In the same talk, Maxwell identified what remains after the burning:
        
        > "The submission of one's will is really the only uniquely personal thing we have to place on God's altar. The many other things we 'give'... are actually the things He has already given or loaned to us."
        
        The altar does not ask for our possessions. It asks for our will. And the promise — for those willing to offer it — is not loss but knowledge. King Lamoni's father understood this when he prayed: "I will give away all my sins to know thee" (Alma 22:18). The altar is where sins are given away. What returns is not the animal but the knowledge of God.
        
        **Note:** The *olah* is the offering of total consecration — entirely consumed, nothing shared. The sacrament, by contrast, is a *shelamim* (שְׁלָמִים) — a shared covenant meal in which God, priest, and worshiper all partake together. Christ's atonement was an *olah*; the sacrament by which we remember it is a *shelamim*. Both originate at this altar, but they serve different functions.
        
        ### Five Offerings — A Complete System
        
        Five types of offering came to this altar, forming a complete system of approach:
        
        | Offering | Hebrew | Purpose |
        |----------|--------|---------|
        | Burnt Offering | *olah* (עֹלָה) | Total consecration — entirely consumed, nothing kept |
        | Grain Offering | *minchah* (מִנְחָה) | Tribute from daily labor, gratitude |
        | Peace Offering | *shelamim* (שְׁלָמִים) | Fellowship — a shared meal: God, priest, and worshiper partake |
        | Sin Offering | *chatat* (חַטָּאת) | Purification from sin's contamination of sacred space |
        | Guilt Offering | *asham* (אָשָׁם) | Restitution for specific wrongs — repayment + 20% |
        
        The first three are voluntary. The last two address brokenness. Together: consecration, gratitude, communion, purification, restitution — the full range of human need before God.
        
        The *olah/shelamim* distinction is especially important. The *olah* ascends entirely — total self-giving, nothing kept. Christ's atonement was the ultimate *olah*: complete consecration, nothing held back, not even His life. When we consecrate our time, talents, and possessions to God's purposes without expectation of return, those follow the *olah* pattern.
        
        The *shelamim* is different — it is shared. Edersheim calls it "the offering of completion" and describes it as "a season of happy fellowship with the Covenant God, in which He condescended to become Israel's Guest at the sacrificial meal, even as He was always their Host" (*The Temple*, ch. 6). God, priest, and worshiper all partake of the same meal. The sacrament is a *shelamim* — a shared covenant meal in which we eat and remember — this reminds us of the *olah* in which everything was offered. Christ's atoning sacrifice was the eternal *olah*; the sacrifice that all sacrifices pointed to.
        
        ### The Perpetual Fire
        
        "The fire shall ever be burning upon the altar; it shall never go out" (Lev 6:13). The command is repeated three times in Lev 6:9-13 — emphasis through repetition.
        
        A tradition holds that the fire was originally lit by God Himself: "There came a fire out from before the LORD, and consumed upon the altar the burnt offering" (Lev 9:24). This was at Aaron's inaugural service. Whether this divine fire was the same fire maintained perpetually is interpretive — the text does not explicitly connect Lev 9:24 to Lev 6:13. But the tradition is strong and widely held: the fire that burns on God's altar was started by God, not by human effort. Human labor maintains it. Divine initiative began it.
        
        Edersheim makes a crucial point about what the burning meant: the Hebrew term used for the altar fire is not the common word for burning (destruction) but means "causing to smoke" — and "the rite symbolises partly the entire surrender of the sacrifice, but chiefly its acceptance on the part of God" (*The Temple*, ch. 5). The fire on the altar was not God's wrath consuming a victim. It was God's acceptance receiving an offering. The smoke ascending was the visible sign that the gift had been received.
        
        The rabbis understood this with striking clarity. Edersheim preserves their teaching: "Properly speaking, the blood of the sinner should have been shed, and his body burned, as those of the sacrifices. But the Holy One — blessed be He! — accepted our sacrifice from us as redemption and atonement. Behold the full grace which Jehovah has shown to man!" The altar fire is not punishment. It is grace — God accepting a substitute so that the sinner can live.
        
        The divine-origin-of-the-fire tradition is well-attested but interpretive. The Lev 9:24 event (God's fire consuming the first offering) and the Lev 6:13 command (keep the fire burning always) are distinct passages that the tradition connects.
        
        ### Horns as Refuge
        
        The four bronze horns at the altar's corners served as a place of refuge. A person fleeing could grasp the horns and receive temporary sanctuary until a fair hearing (1 Kgs 1:50-51; 1 Kgs 2:28). The altar of sacrifice was simultaneously a place of death (for the offering) and a place of safety (for the refugee). Judgment and mercy shared the same location.
        
        But the protection was not unconditional. A person who killed deliberately — not by accident or in the heat of a moment but with premeditation — could be taken from the altar and held accountable (Ex 21:14). The horns offered refuge to those who needed time and a fair hearing, not immunity to those who had done deliberate wrong. Even at the place of mercy, justice was not abandoned.
        
        ### Bronze — The Metal of Judgment
        
        Bronze (*nechoshet*, נְחשֶׁת) dominates the outer court: the brazen altar, the laver, the courtyard pillar bases, the gate sockets. Bronze withstands fire. It is the metal of the zone where fire burns and sacrifice happens.
        
        The brazen serpent (*nechash ha-nechoshet*, Num 21:9) plays on the same root: *nechash* (serpent) / *nechoshet* (bronze). The serpent that killed is rendered in the metal of judgment and lifted up as the means of healing. Jesus drew on this directly: "As Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up: That whosoever believeth in him should not perish, but have eternal life" (John 3:14-15).
        
        ### The First Similitude
        
        From the beginning, sacrifice pointed to Christ. "This thing is a similitude of the sacrifice of the Only Begotten of the Father, which is full of grace and truth" (Moses 5:7). The brazen altar was not merely a place for ritual slaughter. It was a prophetic act — every offering a shadow of the One who would come as "a lamb to the slaughter" (Isa 53:7), upon whom "the LORD hath laid... the iniquity of us all" (Isa 53:6).
        
        And the sacrificial system does not end at Calvary. It transforms: "Ye shall offer up unto me no more the shedding of blood... And ye shall offer for a sacrifice unto me a broken heart and a contrite spirit" (3 Ne 9:19-20). The altar changes. The principle of offering does not.
