  - source_id: exodus-28-2-glory-beauty
    author: Moses / Torah
    work: Exodus
    citation: "28:2"
    tradition_type: biblical-text
    source_tier: primary
    topic_tags:
      - tabernacle
      - priestly-clothing
      - high-priest
    claim_summary: The priestly garments are made "for glory and for beauty."
    direct_quote: "And thou shalt make holy garments for Aaron thy brother for glory and for beauty."
    packet_paraphrase: The holy garments were designed to communicate sacred beauty, office, and consecration.
    warning_note: Use scripture as the primary anchor for all garment symbolism.
    audience_level: core
    use_cases:
