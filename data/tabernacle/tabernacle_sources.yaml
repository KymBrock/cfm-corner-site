  - source_id: numbers-27-21-urim-inquiry
    author: Moses / Torah
    work: Numbers
    citation: "27:21"
    tradition_type: biblical-text
    source_tier: primary
    topic_tags:
      - urim-thummim
      - inquiry
      - judgment
    claim_summary: Inquiry by Urim is tied to seeking judgment before the Lord.
    direct_quote: "He shall stand before Eleazar the priest, who shall ask counsel for him after the judgment of Urim before the Lord."
    packet_paraphrase: Numbers presents the Urim as part of priestly inquiry before God.
    warning_note: Use this to anchor the concept of inquiry rather than to speculate on mechanics.
    audience_level: core
    use_cases:
      - priestly-clothing
      - tabernacle-packet
    related_scriptures:
      - Exodus 28:30
      - 1 Samuel 28:6
    knowlchemy_link: ""
    status: approved

  - source_id: first-samuel-28-6-urim-no-answer
    author: Former Prophets
    work: 1 Samuel
    citation: "28:6"
    tradition_type: biblical-text
    source_tier: primary
    topic_tags:
      - urim-thummim
      - inquiry
      - silence
    claim_summary: The Urim do not guarantee an answer.
    direct_quote: "The Lord answered him not, neither by dreams, nor by Urim, nor by prophets."
    packet_paraphrase: Scripture shows that the Urim and Thummim belong to sacred inquiry, but not to automatic revelation on demand.
    warning_note: Useful against mechanical or superstitious readings.
    audience_level: core
    use_cases:
      - priestly-clothing
      - tabernacle-packet
    related_scriptures:
      - Numbers 27:21
    knowlchemy_link: ""
    status: approved
