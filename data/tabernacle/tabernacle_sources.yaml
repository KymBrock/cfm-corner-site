    status: approved

  - source_id: exodus-28-30-urim-thummim
    author: Moses / Torah
    work: Exodus
    citation: "28:30"
    tradition_type: biblical-text
    source_tier: primary
    topic_tags:
      - tabernacle
      - priestly-clothing
      - breastplate
      - urim-thummim
    claim_summary: The Urim and Thummim are placed in the breastplate of judgment.
    direct_quote: "And thou shalt put in the breastplate of judgment the Urim and the Thummim."
    packet_paraphrase: The Urim and Thummim belong to the breastplate and are associated with sacred judgment before the Lord.
    warning_note: Scripture names them but does not explain their exact physical form or mechanism.
