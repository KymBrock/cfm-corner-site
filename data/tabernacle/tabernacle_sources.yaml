  - source_id: genesis-1-14-signs-seasons
    author: Moses / Torah
    work: Genesis
    citation: "1:14"
    tradition_type: biblical-text
    source_tier: primary
    topic_tags:
      - creation
      - heavenly-bodies
      - moedim
      - sacred-time
    claim_summary: The heavenly lights are given for signs, appointed times, days, and years.
    direct_quote: "Let them be for signs, and for seasons, and for days, and years."
    packet_paraphrase: Genesis frames the heavenly bodies as part of God's created ordering of sacred and calendrical time.
    warning_note: This is not astrology; it is a creation-order text.
    audience_level: core
    use_cases:
      - priestly-clothing
      - moedim-packet
      - tabernacle-packet
    related_scriptures:
      - Genesis 37:9-10
    knowlchemy_link: ""
    status: approved

  - source_id: genesis-37-9-10-joseph-dream
    author: Moses / Torah
    work: Genesis
    citation: "37:9-10"
    tradition_type: biblical-text
    source_tier: primary
    topic_tags:
      - joseph
      - tribes-of-israel
      - heavenly-symbolism
    claim_summary: Joseph's dream uses sun, moon, and stars to symbolize covenant family order.
    direct_quote: "Behold, the sun and the moon and the eleven stars made obeisance to me."
    packet_paraphrase: Joseph's dream establishes a scriptural pattern in which the covenant family is described in heavenly terms.
    warning_note: Use this as pattern language, not as a claim that Exodus explicitly interprets the garments this way.
    audience_level: advanced
    use_cases:
      - priestly-clothing
      - tabernacle-packet
    related_scriptures:
      - Genesis 1:14
    knowlchemy_link: ""
    status: approved

  - source_id: josephus-antiquities-3-7-7-garments-cosmos
    author: Josephus
    work: Antiquities of the Jews
    citation: "3.7.7"
    tradition_type: jewish-interpretive
    source_tier: comparative-ancient
    topic_tags:
      - tabernacle
      - priestly-clothing
      - cosmos
      - breastplate
      - shoulder-stones
      - blue-robe
      - bells-pomegranates
    claim_summary: Josephus reads the priestly garments and materials as a symbolic rendering of the created order.
    direct_quote: "The blue denoted the sky, the purple the sea, the scarlet fire, and the fine linen the earth."
    packet_paraphrase: Josephus presents the garments as a wearable model of the cosmos, linking their materials and ornaments to earth, sky, fire, sea, sun, moon, and the constellations or months.
    warning_note: Ancient Jewish interpretation; not the plain sense of Exodus.
    audience_level: advanced
    use_cases:
      - priestly-clothing
      - tabernacle-packet
      - deeper-dive
    related_scriptures:
      - Exodus 28:6-35
      - Exodus 39:2-31
    knowlchemy_link: knowlchemy://source/josephus-antiquities-3-7-7-garments-cosmos
    status: approved

  - source_id: josephus-antiquities-3-7-7-shoulder-stones
    author: Josephus
    work: Antiquities of the Jews
    citation: "3.7.7"
    tradition_type: jewish-interpretive
    source_tier: comparative-ancient
    topic_tags:
      - priestly-clothing
      - shoulder-stones
      - sun-moon
    claim_summary: Josephus associates the two shoulder stones with the sun and moon.
    direct_quote: "The two sardonyxes declare the sun and moon."
    packet_paraphrase: Josephus expands the memorial role of the shoulder stones by reading them as cosmic lights.
    warning_note: Useful for advanced symbolic reading, not for core explanatory copy.
    audience_level: advanced
