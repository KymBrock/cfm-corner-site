  - source_id: josephus-antiquities-3-7-7-breastplate
    author: Josephus
    work: Antiquities of the Jews
    citation: "3.7.7"
    tradition_type: jewish-interpretive
    source_tier: comparative-ancient
    topic_tags:
      - priestly-clothing
      - breastplate
      - months
      - constellations
    claim_summary: Josephus connects the twelve breastplate stones with the months or zodiacal signs.
    direct_quote: "Whether we understand by them the months, or whether we understand the like number of the signs of that circle which the Greeks call the Zodiac."
    packet_paraphrase: Josephus explicitly presents the twelve stones as representing the full ordered cycle of heaven or time.
    warning_note: If used in packet copy, clarify that this is Josephus' interpretive reading.
    audience_level: advanced
    use_cases:
      - priestly-clothing
      - deeper-dive
    related_scriptures:
      - Exodus 28:15-21
    knowlchemy_link: knowlchemy://source/josephus-antiquities-3-7-7-breastplate
    status: approved

  - source_id: philo-life-of-moses-2-117-126-garments-cosmos
    author: Philo of Alexandria
    work: Life of Moses
    citation: "2.117-126"
    tradition_type: jewish-interpretive
    source_tier: comparative-ancient
    topic_tags:
      - tabernacle
      - priestly-clothing
      - cosmos
      - breastplate
      - bells-pomegranates
      - shoulder-stones
      - blue-robe
    claim_summary: Philo reads the priestly garments as a symbolic map of the ordered heavens and elements.
    direct_quote: "The high priest is arrayed in a copy and representation of the universe."
    packet_paraphrase: Philo develops the same cosmic logic as Josephus, but in a more philosophical and systematized way.
    warning_note: Some wording varies by translation; quote carefully and standardize the edition used.
    audience_level: advanced
    use_cases:
      - priestly-clothing
      - tabernacle-packet
      - deeper-dive
    related_scriptures:
      - Exodus 28:6-35
    knowlchemy_link: knowlchemy://source/philo-life-of-moses-2-117-126-garments-cosmos
    status: approved

