  - source_id: leviticus-8-8-urim-thummim
    author: Moses / Torah
    work: Leviticus
    citation: "8:8"
    tradition_type: biblical-text
    source_tier: primary
    topic_tags:
      - urim-thummim
      - vesting
      - breastplate
    claim_summary: The vesting of Aaron includes the Urim and Thummim in the breastplate.
    direct_quote: "Also he put in the breastplate the Urim and the Thummim."
    packet_paraphrase: Leviticus confirms that the Urim and Thummim belonged to the vested priestly system, not to an isolated object.
    warning_note: Useful as a confirmation text alongside Exodus 28:30.
    audience_level: core
    use_cases:
      - priestly-clothing
