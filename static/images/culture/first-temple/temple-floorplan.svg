<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 510" role="img"
     aria-label="Schematic floor plan of Solomon's Temple, 1 Kings 6-7, drawn to verified cubit dimensions: porch (Ulam) 20 by 10, Holy Place (Hekhal) 40 by 20, Holy of Holies (Devir) a 20-cubit cube, with the pillars Jachin and Boaz, the molten sea, brazen altar, ten lavers, and side chambers.">
  <title>Solomon's Temple — Floor Plan (1 Kings 6–7)</title>
  <style>
    .lbl   { font-family: Georgia, "Times New Roman", serif; fill: #383731; }
    .room  { font-family: Georgia, "Times New Roman", serif; fill: #2d3748; font-weight: 600; }
    .sub   { font-family: Georgia, "Times New Roman", serif; fill: #4a5568; }
    .dim   { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; fill: #718096; }
    .note  { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; fill: #718096; }
    .title { font-family: Georgia, "Times New Roman", serif; fill: #2d3748; }
    .wall  { fill: none; stroke: #383731; stroke-width: 2.5; }
  </style>

  <!-- ===== Title ===== -->
  <text class="title" x="640" y="34" text-anchor="middle" font-size="26" font-weight="700">Solomon's Temple — Floor Plan</text>
  <text class="sub"   x="640" y="54" text-anchor="middle" font-size="13">1 Kings 6–7 · dimensions in cubits (1 cubit ≈ 18 in / 0.46 m) · entrance faces east</text>

  <!-- ===== Courtyard ground (behind courtyard furniture) ===== -->
  <rect x="790" y="80" width="450" height="320" fill="#f2f5f2" stroke="#c6d4c8" stroke-width="1" rx="6"/>
  <text class="dim" x="800" y="394" font-size="11" font-style="italic">Courtyard — furniture placement schematic (sea SE, 1 Kgs 7:39)</text>

  <!-- ===== Side chambers (behind the house) ===== -->
  <g>
    <rect x="90"  y="90"  width="600" height="50"  fill="#dce8dd" stroke="#7c9885" stroke-width="1.5"/>
    <rect x="90"  y="340" width="600" height="50"  fill="#dce8dd" stroke="#7c9885" stroke-width="1.5"/>
    <rect x="40"  y="90"  width="50"  height="300" fill="#dce8dd" stroke="#7c9885" stroke-width="1.5"/>
    <!-- chamber subdivisions (cosmetic) -->
    <line x1="190" y1="90" x2="190" y2="140" stroke="#7c9885" stroke-width="0.75"/>
    <line x1="290" y1="90" x2="290" y2="140" stroke="#7c9885" stroke-width="0.75"/>
    <line x1="390" y1="90" x2="390" y2="140" stroke="#7c9885" stroke-width="0.75"/>
    <line x1="490" y1="90" x2="490" y2="140" stroke="#7c9885" stroke-width="0.75"/>
    <line x1="590" y1="90" x2="590" y2="140" stroke="#7c9885" stroke-width="0.75"/>
    <line x1="190" y1="340" x2="190" y2="390" stroke="#7c9885" stroke-width="0.75"/>
    <line x1="290" y1="340" x2="290" y2="390" stroke="#7c9885" stroke-width="0.75"/>
    <line x1="390" y1="340" x2="390" y2="390" stroke="#7c9885" stroke-width="0.75"/>
    <line x1="490" y1="340" x2="490" y2="390" stroke="#7c9885" stroke-width="0.75"/>
    <line x1="590" y1="340" x2="590" y2="390" stroke="#7c9885" stroke-width="0.75"/>
  </g>

  <!-- ===== House: Hekhal + Devir + Ulam ===== -->
  <!-- Hekhal (Holy Place) 40 x 20 -->
  <rect x="290" y="140" width="400" height="200" fill="#f5ecd0"/>
  <!-- Devir (Holy of Holies) 20 x 20 cube -->
  <rect x="90"  y="140" width="200" height="200" fill="#d5a93c"/>
  <!-- Ulam (porch) 20 wide x 10 deep -->
  <rect x="690" y="140" width="100" height="200" fill="#faf3df"/>

  <!-- carved-interior hint in Hekhal (cherubim/palms/flowers, 1 Kgs 6:29) -->
  <g opacity="0.30" stroke="#d5a93c" stroke-width="1" fill="none">
    <path d="M340 180 q10 -14 20 0 M340 180 q-10 -14 -20 0"/>
    <path d="M440 300 q10 -14 20 0 M440 300 q-10 -14 -20 0"/>
    <path d="M560 200 q10 -14 20 0 M560 200 q-10 -14 -20 0"/>
    <path d="M620 300 q10 -14 20 0 M620 300 q-10 -14 -20 0"/>
  </g>

  <!-- Outer walls -->
  <rect class="wall" x="90"  y="140" width="600" height="200"/>  <!-- house (devir+hekhal) -->
  <rect class="wall" x="690" y="140" width="100" height="200"/>  <!-- porch -->

  <!-- Olive-wood doors / veil partition between Hekhal and Devir (cx=20) -->
  <line x1="290" y1="140" x2="290" y2="340" stroke="#8a5a2b" stroke-width="6"/>
  <line x1="296" y1="146" x2="296" y2="334" stroke="#6a5983" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Cherubim in the Devir: two olive-wood figures, wings span the 20-cubit width -->
  <g stroke="#8a5a2b" stroke-width="2" fill="#e8cc7a" opacity="0.95">
    <!-- left cherub -->
    <circle cx="150" cy="240" r="9"/>
    <path d="M150 240 L95 215 M150 240 L190 222" fill="none" stroke-width="2.5"/>
    <!-- right cherub -->
    <circle cx="230" cy="240" r="9"/>
    <path d="M230 240 L285 215 M230 240 L190 222" fill="none" stroke-width="2.5"/>
  </g>
  <!-- Ark of the covenant (folded into the Devir hotspot) -->
  <rect x="176" y="256" width="28" height="18" rx="2" fill="#c37c3c" stroke="#383731" stroke-width="1.5"/>
  <text class="lbl" x="190" y="290" text-anchor="middle" font-size="10" font-style="italic">Ark</text>

  <!-- ===== Pillars Jachin (S/right) & Boaz (N/left) at the porch face ===== -->
  <circle cx="795" cy="320" r="11" fill="#c37c3c" stroke="#383731" stroke-width="2"/>
  <circle cx="795" cy="160" r="11" fill="#c37c3c" stroke="#383731" stroke-width="2"/>
  <text class="lbl" x="818" y="324" font-size="12">Jachin</text>
  <text class="lbl" x="818" y="164" font-size="12">Boaz</text>

  <!-- ===== Brazen altar (2 Chr 4:1: 20 x 20 x 10) ===== -->
  <rect x="870" y="140" width="200" height="200" fill="#c65528" stroke="#383731" stroke-width="2" opacity="0.9"/>
  <rect x="900" y="170" width="140" height="140" fill="none" stroke="#7a2f15" stroke-width="1.5"/>
  <rect x="930" y="200" width="80"  height="80"  fill="none" stroke="#7a2f15" stroke-width="1.5"/>
  <text class="room" x="970" y="236" text-anchor="middle" font-size="13" fill="#fff">Brazen</text>
  <text class="room" x="970" y="252" text-anchor="middle" font-size="13" fill="#fff">Altar</text>

  <!-- ===== Molten sea (10-cubit dia, on 12 oxen, SE corner) ===== -->
  <g>
    <!-- 12 oxen, 3 per direction -->
    <g fill="#8a5a2b">
      <circle cx="1170" cy="300" r="5"/><circle cx="1152" cy="304" r="5"/><circle cx="1188" cy="304" r="5"/>
      <circle cx="1170" cy="420" r="5"/><circle cx="1152" cy="416" r="5"/><circle cx="1188" cy="416" r="5"/>
      <circle cx="1110" cy="360" r="5"/><circle cx="1114" cy="342" r="5"/><circle cx="1114" cy="378" r="5"/>
      <circle cx="1230" cy="360" r="5"/><circle cx="1226" cy="342" r="5"/><circle cx="1226" cy="378" r="5"/>
    </g>
    <circle cx="1170" cy="360" r="46" fill="#8ab0be" stroke="#c37c3c" stroke-width="5"/>
    <circle cx="1170" cy="360" r="36" fill="none" stroke="#57899c" stroke-width="1.5"/>
    <text class="room" x="1170" y="356" text-anchor="middle" font-size="12">Molten</text>
    <text class="room" x="1170" y="372" text-anchor="middle" font-size="12">Sea</text>
  </g>

  <!-- ===== Ten lavers: 5 north + 5 south ===== -->
  <g fill="#c37c3c" stroke="#383731" stroke-width="1.25">
    <!-- north row (y ~110) -->
    <g>
      <rect x="822" y="104" width="16" height="12" rx="2"/><rect x="882" y="104" width="16" height="12" rx="2"/>
      <rect x="942" y="104" width="16" height="12" rx="2"/><rect x="1002" y="104" width="16" height="12" rx="2"/>
      <rect x="1062" y="104" width="16" height="12" rx="2"/>
    </g>
    <!-- south row (y ~364) -->
    <g>
      <rect x="822" y="364" width="16" height="12" rx="2"/><rect x="882" y="364" width="16" height="12" rx="2"/>
      <rect x="942" y="364" width="16" height="12" rx="2"/></g>
  </g>
  <text class="lbl" x="822" y="98"  font-size="11">Ten Lavers — 5 north / 5 south (1 Kgs 7:38–39)</text>

  <!-- ===== Room labels ===== -->
  <text class="room" x="190" y="220" text-anchor="middle" font-size="16">Devir</text>
  <text class="sub"  x="190" y="238" text-anchor="middle" font-size="11">Holy of Holies · 20×20×20</text>

  <text class="room" x="470" y="232" text-anchor="middle" font-size="18">Hekhal</text>
  <text class="sub"  x="470" y="250" text-anchor="middle" font-size="12">Holy Place · 40 × 20 × 30</text>

  <text class="room" x="740" y="232" text-anchor="middle" font-size="13" transform="rotate(0 740 232)">Ulam</text>
  <text class="sub"  x="740" y="248" text-anchor="middle" font-size="10">Porch · 20 × 10</text>

  <!-- ===== Dimension annotation: 60-cubit house length ===== -->
  <g class="dim" font-size="11">
    <line x1="90" y1="408" x2="690" y2="408" stroke="#a0aab0" stroke-width="1"/>
    <line x1="90" y1="403" x2="90" y2="413" stroke="#a0aab0" stroke-width="1"/>
    <line x1="690" y1="403" x2="690" y2="413" stroke="#a0aab0" stroke-width="1"/>
    <text x="390" y="404" text-anchor="middle">house: 60 cubits long × 20 wide (1 Kgs 6:2)</text>
  </g>

  <!-- ===== Compass (top-right) ===== -->
  <g transform="translate(1175 132)" class="lbl" font-size="11" text-anchor="middle">
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#718096" stroke-width="1"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#718096" stroke-width="1"/>
    <path d="M0 -18 L-3 -12 L3 -12 Z" fill="#718096"/>
    <text x="0" y="-22">N</text><text x="0" y="30">S</text>
    <text x="26" y="4">E</text><text x="-26" y="4">W</text>
  </g>

  <!-- ===== Scale bar ===== -->
  <g transform="translate(90 430)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#383731" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#383731" stroke-width="2"/>
    <line x1="100" y1="-4" x2="100" y2="4" stroke="#383731" stroke-width="2"/>
    <text class="dim" x="0" y="16" font-size="11">10 cubits ≈ 4.6 m</text>
  </g>

  <!-- ===== Footnotes (verified tensions + provenance) ===== -->
  <g class="note" font-size="10.5">
    <text x="90"  y="460">Pillars rendered at 18 cubits + 5-cubit capital (1 Kgs 7:15); 2 Chr 3:15 reads 35. · Molten sea labeled 2,000 baths (1 Kgs 7:26); 2 Chr 4:5 reads 3,000.</text>
    <text x="90"  y="476">Altar dimensions from 2 Chr 4:1 (1 Kgs 7 omits them). · Partition: olive-wood doors (1 Kgs 6:31) and a veil (2 Chr 3:14) — both attested, both shown.</text>
    <text x="90"  y="492">No remains of Solomon's Temple have been excavated; this is a reconstruction from the biblical text. Original CFM Corner schematic — not derived from any copyrighted reconstruction.</text>
  </g>
</svg>
