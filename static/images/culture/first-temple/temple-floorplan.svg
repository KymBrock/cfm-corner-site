<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 510" role="img"
     aria-label="Illustrated top-down floor plan of Solomon's Temple (1 Kings 6-7) in CFM Corner Moedim style, drawn to verified cubit dimensions: porch (Ulam) 20 by 10, Holy Place (Hekhal) 40 by 20, Holy of Holies (Devir) a 20-cubit cube, with the pillars Jachin and Boaz, the molten sea on twelve oxen, the brazen altar, ten lavers, and side chambers.">
  <title>Solomon's Temple — Floor Plan (1 Kings 6–7)</title>
  <defs>
    <style>
      .ttl  { font-family: Georgia,"Times New Roman",serif; fill:#243049; }
      .room { font-family: Georgia,"Times New Roman",serif; fill:#243049; font-weight:600; }
      .sub  { font-family: Georgia,"Times New Roman",serif; fill:#5a4a32; }
      .lbl  { font-family: Georgia,"Times New Roman",serif; fill:#243049; }
      .note { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; fill:#6b5a3e; }
    </style>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#5a4422" flood-opacity="0.30"/>
    </filter>
    <filter id="soft-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5a4422" flood-opacity="0.30"/>
    </filter>
    <radialGradient id="vign" cx="50%" cy="46%" r="72%">
      <stop offset="62%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5a4422" stop-opacity="0.16"/>
    </radialGradient>
    <linearGradient id="goldgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c469"/><stop offset="1" stop-color="#c2942f"/>
    </linearGradient>
    <linearGradient id="stonegrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3d2ac"/><stop offset="1" stop-color="#cdb481"/>
    </linearGradient>
    <!-- paper-cut palm -->
    <g id="palm">
      <ellipse cx="0" cy="26" rx="17" ry="5" fill="#5a4422" opacity="0.18"/>
      <rect x="-3.5" y="-2" width="7" height="28" rx="3.5" fill="#9c7b4e"/>
      <rect x="-3.5" y="-2" width="3" height="28" rx="1.5" fill="#b08f5e"/>
      <g fill="#6f8a55">
        <path d="M0 -4 Q-26 -10 -34 2 Q-20 -6 0 0 Z"/>
        <path d="M0 -4 Q26 -10 34 2 Q20 -6 0 0 Z"/>
        <path d="M0 -6 Q-20 -26 -30 -22 Q-14 -16 0 -2 Z"/>
        <path d="M0 -6 Q20 -26 30 -22 Q14 -16 0 -2 Z"/>
      </g>
      <g fill="#86a06b">
        <path d="M0 -7 Q-9 -30 -2 -34 Q2 -22 2 -4 Z"/>
        <path d="M0 -7 Q9 -30 2 -34 Q-2 -22 -2 -4 Z"/>
      </g>
      <circle cx="0" cy="-4" r="3" fill="#7d5b2f"/>
    </g>
    <!-- paper-cut rock -->
    <g id="rock">
      <ellipse cx="0" cy="7" rx="16" ry="5" fill="#5a4422" opacity="0.16"/>
      <path d="M-15 6 Q-13 -8 0 -9 Q15 -8 15 6 Z" fill="#c9b487"/>
      <path d="M-15 6 Q-13 -8 0 -9 Q6 -7 4 6 Z" fill="#dccaa0"/>
    </g>
  </defs>

  <!-- ===== Warm parchment ground ===== -->
  <rect x="0" y="0" width="1280" height="510" fill="#f1e3c6"/>

  <!-- ===== Sacred precinct: sand court enclosed by a stone wall ===== -->
  <g filter="url(#soft)">
    <rect x="52" y="72" width="1196" height="336" rx="14" fill="#e9d4a8"/>
  </g>
  <rect x="52" y="72" width="1196" height="336" rx="14" fill="none" stroke="#bb9b66" stroke-width="7"/>
  <rect x="52" y="72" width="1196" height="336" rx="14" fill="none" stroke="#d8c08c" stroke-width="2.5"/>

  <!-- corner palms + scattered rocks (within the sand) -->
  <use href="#palm" x="1212" y="206"/>
  <use href="#palm" x="92"  y="372"/>
  <use href="#rock" x="1150" y="120" transform="scale(0.8)" style="transform-box:fill-box"/>
  <use href="#rock" x="120"  y="120"/>
  <use href="#rock" x="1208" y="356"/>
  <use href="#rock" x="660"  y="384"/>

  <!-- ===== Side chambers (paper-cut, behind house) ===== -->
  <g filter="url(#soft-sm)">
    <rect x="90"  y="90"  width="600" height="50"  rx="3" fill="#d2b98a"/>
    <rect x="90"  y="340" width="600" height="50"  rx="3" fill="#d2b98a"/>
    <rect x="40"  y="90"  width="50"  height="300" rx="3" fill="#d2b98a"/>
  </g>
  <g stroke="#b89a64" stroke-width="1">
    <line x1="190" y1="90" x2="190" y2="140"/><line x1="290" y1="90" x2="290" y2="140"/>
    <line x1="390" y1="90" x2="390" y2="140"/><line x1="490" y1="90" x2="490" y2="140"/>
    <line x1="590" y1="90" x2="590" y2="140"/>
    <line x1="190" y1="340" x2="190" y2="390"/><line x1="290" y1="340" x2="290" y2="390"/>
    <line x1="390" y1="340" x2="390" y2="390"/><line x1="490" y1="340" x2="490" y2="390"/>
    <line x1="590" y1="340" x2="590" y2="390"/>
    <line x1="40" y1="190" x2="90" y2="190"/><line x1="40" y1="290" x2="90" y2="290"/>
  </g>

  <!-- ===== The House (paper-cut stone shell with gold rooms) ===== -->
  <g filter="url(#soft)">
    <rect x="90" y="140" width="700" height="200" rx="4" fill="url(#stonegrad)"/>
  </g>
  <!-- Ulam (porch) -->
  <rect x="690" y="140" width="100" height="200" fill="#ddca9d"/>
  <!-- Hekhal (Holy Place) -->
  <rect x="298" y="148" width="384" height="184" rx="3" fill="#efe1bd"/>
  <!-- Devir (Holy of Holies) gold cube -->
  <rect x="98"  y="148" width="184" height="184" rx="3" fill="url(#goldgrad)"/>
  <!-- house outline -->
  <rect x="90" y="140" width="700" height="200" rx="4" fill="none" stroke="#9c7c46" stroke-width="3"/>

  <!-- cedar-carving hint in Hekhal (cherubim/palms/flowers, 1 Kgs 6:29) -->
  <g opacity="0.5" stroke="#c89b3c" stroke-width="1.4" fill="none">
    <path d="M340 176 q9 -12 18 0 M340 176 q-9 -12 -18 0"/>
    <circle cx="340" cy="176" r="2.2" fill="#c89b3c" stroke="none"/>
    <path d="M470 176 q9 -12 18 0 M470 176 q-9 -12 -18 0"/>
    <circle cx="470" cy="176" r="2.2" fill="#c89b3c" stroke="none"/>
    <path d="M600 176 q9 -12 18 0 M600 176 q-9 -12 -18 0"/>
    <circle cx="600" cy="176" r="2.2" fill="#c89b3c" stroke="none"/>
    <path d="M405 308 q9 -12 18 0 M405 308 q-9 -12 -18 0"/>
    <path d="M535 308 q9 -12 18 0 M535 308 q-9 -12 -18 0"/>
  </g>
  <!-- a few golden lampstands + tables in the Hekhal (paper-cut) -->
  <g>
    <g transform="translate(360,250)"><circle r="7" fill="#c89b3c" stroke="#9c7c46" stroke-width="1.2"/><path d="M-5 0 v-7 M0 0 v-9 M5 0 v-7" stroke="#9c7c46" stroke-width="1.2"/></g>
    <g transform="translate(620,250)"><circle r="7" fill="#c89b3c" stroke="#9c7c46" stroke-width="1.2"/><path d="M-5 0 v-7 M0 0 v-9 M5 0 v-7" stroke="#9c7c46" stroke-width="1.2"/></g>
    <rect x="476" y="245" width="28" height="14" rx="2" fill="#d9b24f" stroke="#9c7c46" stroke-width="1.2"/>
  </g>

  <!-- Olive-wood doors / veil partition (cx=20) -->
  <line x1="290" y1="148" x2="290" y2="332" stroke="#8a5a2b" stroke-width="6"/>
  <line x1="296" y1="152" x2="296" y2="328" stroke="#6a5983" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Cherubim (paper-cut, gold) spanning the Devir width -->
  <g filter="url(#soft-sm)">
    <g fill="#e7cd78" stroke="#9c7c46" stroke-width="1.6">
      <path d="M150 240 Q120 210 100 222 Q128 228 138 244 Q120 232 150 240Z"/>
      <path d="M230 240 Q260 210 280 222 Q252 228 242 244 Q260 232 230 240Z"/>
      <circle cx="150" cy="240" r="8"/><circle cx="230" cy="240" r="8"/>
      <path d="M150 240 L190 230 M230 240 L190 230" stroke-width="2"/>
    </g>
  </g>
  <!-- Ark (gold chest) at devir center -->
  <g filter="url(#soft-sm)">
    <rect x="176" y="256" width="28" height="18" rx="2.5" fill="#d9b24f" stroke="#8a5a2b" stroke-width="1.6"/>
    <rect x="176" y="256" width="28" height="5" rx="2" fill="#ecd07e"/>
  </g>
  <text class="lbl" x="190" y="292" text-anchor="middle" font-size="10" font-style="italic" fill="#7a5a2e">Ark</text>

  <!-- ===== Pillars Jachin (S/right) & Boaz (N/left) ===== -->
  <g filter="url(#soft-sm)">
    <g>
      <circle cx="795" cy="320" r="13" fill="#b5763a" stroke="#7d5224" stroke-width="2"/>
      <circle cx="795" cy="320" r="13" fill="none" stroke="#e0b878" stroke-width="1.5"/>
      <circle cx="795" cy="320" r="4" fill="#e0b878"/>
    </g>
    <g>
      <circle cx="795" cy="160" r="13" fill="#b5763a" stroke="#7d5224" stroke-width="2"/>
      <circle cx="795" cy="160" r="13" fill="none" stroke="#e0b878" stroke-width="1.5"/>
      <circle cx="795" cy="160" r="4" fill="#e0b878"/>
    </g>
  </g>
  <text class="lbl" x="820" y="324" font-size="12.5">Jachin</text>
  <text class="lbl" x="820" y="164" font-size="12.5">Boaz</text>

  <!-- ===== Brazen altar (paper-cut, 2 Chr 4:1) ===== -->
  <g filter="url(#soft)">
    <rect x="876" y="146" width="188" height="188" rx="5" fill="#c4622d"/>
    <rect x="900" y="170" width="140" height="140" rx="4" fill="#b1551f"/>
    <rect x="928" y="198" width="84"  height="84"  rx="4" fill="#9d4a1f"/>
    <!-- flame -->
    <path d="M970 214 q14 16 0 38 q-14 -10 0 -38Z" fill="#e8902f"/>
    <path d="M970 224 q8 10 0 24 q-8 -6 0 -24Z" fill="#f2c14e"/>
  </g>
  <text class="room" x="970" y="160" text-anchor="middle" font-size="12" fill="#7a3414">Brazen Altar</text>

  <!-- ===== Molten sea (paper-cut basin on 12 oxen) ===== -->
  <g filter="url(#soft)">
    <g fill="#b5763a" stroke="#7d5224" stroke-width="1">
      <circle cx="1170" cy="302" r="5.5"/><circle cx="1151" cy="306" r="5.5"/><circle cx="1189" cy="306" r="5.5"/>
      <circle cx="1170" cy="418" r="5.5"/><circle cx="1151" cy="414" r="5.5"/><circle cx="1189" cy="414" r="5.5"/>
      <circle cx="1112" cy="360" r="5.5"/><circle cx="1116" cy="343" r="5.5"/><circle cx="1116" cy="377" r="5.5"/>
      <circle cx="1228" cy="360" r="5.5"/><circle cx="1224" cy="343" r="5.5"/><circle cx="1224" cy="377" r="5.5"/>
    </g>
    <circle cx="1170" cy="360" r="46" fill="#c89b3c"/>
    <circle cx="1170" cy="360" r="40" fill="#5a7d92"/>
    <circle cx="1170" cy="360" r="40" fill="none" stroke="#3f5e70" stroke-width="1.5"/>
    <path d="M1138 350 q32 14 64 0" fill="none" stroke="#8fb0bf" stroke-width="2.5"/>
  </g>
  <text class="room" x="1170" y="358" text-anchor="middle" font-size="11" fill="#f2efe6">Molten</text>
  <text class="room" x="1170" y="372" text-anchor="middle" font-size="11" fill="#f2efe6">Sea</text>

  <!-- ===== Ten lavers (paper-cut basins): 5 north + 5 south ===== -->
  <g filter="url(#soft-sm)">
    <g>
      <!-- north row -->
      <g transform="translate(830,110)"><circle r="9" fill="#c89b3c"/><circle r="6" fill="#5a7d92"/></g>
      <g transform="translate(890,110)"><circle r="9" fill="#c89b3c"/><circle r="6" fill="#5a7d92"/></g>
      <g transform="translate(950,110)"><circle r="9" fill="#c89b3c"/><circle r="6" fill="#5a7d92"/></g>
      <g transform="translate(1010,110)"><circle r="9" fill="#c89b3c"/><circle r="6" fill="#5a7d92"/></g>
      <g transform="translate(1070,110)"><circle r="9" fill="#c89b3c"/><circle r="6" fill="#5a7d92"/></g>
      <!-- south row -->
      <g transform="translate(830,368)"><circle r="9" fill="#c89b3c"/><circle r="6" fill="#5a7d92"/></g>
      <g transform="translate(890,368)"><circle r="9" fill="#c89b3c"/><circle r="6" fill="#5a7d92"/></g>
      <g transform="translate(950,368)"><circle r="9" fill="#c89b3c"/><circle r="6" fill="#5a7d92"/></g>
    </g>
  </g>
  <text class="note" x="830" y="96" font-size="11" fill="#5a4a32">Ten Lavers — 5 north / 5 south (1 Kgs 7:38–39)</text>

  <!-- ===== Room labels (navy serif on parchment chips) ===== -->
  <g>
    <rect x="148" y="206" width="84" height="36" rx="6" fill="#f7eed8" opacity="0.86"/>
    <text class="room" x="190" y="222" text-anchor="middle" font-size="15">Devir</text>
    <text class="sub"  x="190" y="236" text-anchor="middle" font-size="10">Holy of Holies · 20³</text>
  </g>
  <g>
    <rect x="412" y="214" width="116" height="38" rx="6" fill="#f7eed8" opacity="0.86"/>
    <text class="room" x="470" y="231" text-anchor="middle" font-size="17">Hekhal</text>
    <text class="sub"  x="470" y="246" text-anchor="middle" font-size="11">Holy Place · 40 × 20</text>
  </g>
  <g>
    <rect x="704" y="214" width="72" height="36" rx="6" fill="#f7eed8" opacity="0.86"/>
    <text class="room" x="740" y="230" text-anchor="middle" font-size="12">Ulam</text>
    <text class="sub"  x="740" y="244" text-anchor="middle" font-size="9.5">Porch · 20×10</text>
  </g>

  <!-- ===== Title ===== -->
  <text class="ttl" x="640" y="34" text-anchor="middle" font-size="26" font-weight="700">Solomon's Temple — Floor Plan</text>
  <text class="sub" x="640" y="54" text-anchor="middle" font-size="13">1 Kings 6–7 · dimensions in cubits (1 cubit ≈ 18 in / 0.46 m) · entrance faces east</text>

  <!-- ===== Dimension annotation ===== -->
  <g class="note" font-size="11" fill="#6b5a3e">
    <line x1="90" y1="402" x2="690" y2="402" stroke="#a88f5e" stroke-width="1"/>
    <line x1="90" y1="397" x2="90" y2="407" stroke="#a88f5e" stroke-width="1"/>
    <line x1="690" y1="397" x2="690" y2="407" stroke="#a88f5e" stroke-width="1"/>
    <text x="390" y="398" text-anchor="middle">house: 60 cubits long × 20 wide (1 Kgs 6:2)</text>
  </g>

  <!-- ===== Compass ===== -->
  <g transform="translate(115 132)" class="lbl" font-size="11" text-anchor="middle">
    <circle r="22" fill="#f7eed8" opacity="0.8"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#7a6442" stroke-width="1"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#7a6442" stroke-width="1"/>
    <path d="M0 -16 L-3 -9 L3 -9 Z" fill="#c4622d"/>
    <text x="0" y="-19">N</text><text x="0" y="27">S</text><text x="24" y="4">E</text><text x="-24" y="4">W</text>
  </g>

  <!-- ===== Scale bar ===== -->
  <g transform="translate(770 424)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#5a4a32" stroke-width="2.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#5a4a32" stroke-width="2.5"/>
    <line x1="100" y1="-4" x2="100" y2="4" stroke="#5a4a32" stroke-width="2.5"/>
    <text class="note" x="108" y="4" font-size="11" fill="#5a4a32">= 10 cubits (≈ 4.6 m)</text>
  </g>

  <!-- ===== Footnotes ===== -->
  <g class="note" font-size="10.5">
    <text x="90" y="460">Pillars rendered at 18 cubits + 5-cubit capital (1 Kgs 7:15); 2 Chr 3:15 reads 35. · Molten sea labeled 2,000 baths (1 Kgs 7:26); 2 Chr 4:5 reads 3,000.</text>
    <text x="90" y="476">Altar dimensions from 2 Chr 4:1 (1 Kgs 7 omits them). · Partition: olive-wood doors (1 Kgs 6:31) and a veil (2 Chr 3:14) — both attested, both shown.</text>
    <text x="90" y="492">No remains of Solomon's Temple have been excavated; this is a reconstruction from the biblical text. Original CFM Corner illustration — not derived from any copyrighted reconstruction.</text>
  </g>

  <!-- ===== Edge vignette ===== -->
  <rect x="0" y="0" width="1280" height="510" fill="url(#vign)" pointer-events="none"/>
</svg>
