<style>
.ft-mock{max-width:1100px;margin:10px auto 0;padding:8px 14px;border:1px dashed #b5873a;border-radius:8px;background:#fbf3e2;color:#7a5c2e;font:13px/1.4 system-ui,sans-serif}
.ft-stage{max-width:1180px;margin:8px auto 0;padding:6px 16px 54vh}
#ft-floorplan-svg{width:100%;height:auto;display:block}
.ft-hit{fill:transparent;stroke:transparent;stroke-width:3;cursor:pointer;transition:fill .14s,stroke .14s}
.ft-hit:hover{fill:rgba(181,135,58,.26);stroke:#b5873a}
.ft-hit--frame{stroke-linejoin:round;stroke-linecap:round}
#ft-tip{position:fixed;pointer-events:none;background:#2e2a22;color:#f3ecdd;font:13px/1 system-ui,sans-serif;padding:6px 10px;border-radius:6px;opacity:0;transform:translate(-50%,-130%);transition:opacity .12s;z-index:3000;white-space:nowrap}
#ft-panel{position:fixed;left:0;right:0;bottom:0;width:100%;max-height:52vh;background:#f4ecd9;box-shadow:0 -10px 30px rgba(0,0,0,.20);border-top:3px solid #b5873a;transform:translateY(103%);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:3001;overflow:auto;padding:8px 0 36px;font:16px/1.6 Georgia,serif;color:#2e2a22}
#ft-panel.on{transform:none}
#ft-panel .handle{width:46px;height:5px;border-radius:3px;background:#d3c19a;margin:4px auto 8px}
#ft-panel .inner{max-width:900px;margin:0 auto;padding:0 28px;position:relative}
#ft-panel .x{position:absolute;top:-2px;right:24px;cursor:pointer;font:24px/1 system-ui;color:#7a5c2e;background:none;border:none}
.ft-panel-img{float:right;max-width:36%;max-height:40vh;margin:2px 0 14px 22px;border-radius:8px;background:#fffdf6;border:1px solid #cdb98a;object-fit:contain}
#ft-panel .eyebrow{font:11px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#b5873a;margin:0}
#ft-panel h2{font-size:25px;color:#7a5c2e;margin:6px 0 2px;line-height:1.15}#ft-panel .heb{font-size:18px;color:#5a4a2e;margin:0 0 2px}
#ft-panel .scrip{display:inline-block;background:#efe6d2;border:1px solid #cdb98a;border-radius:999px;padding:3px 12px;font:12px/1 system-ui,sans-serif;color:#7a5c2e;margin:8px 0 12px}
#ft-panel p{margin:10px 0}#ft-panel em{color:#6a4f28}
.ft-deeper{margin-top:12px;border-top:1px dashed #cdb98a;padding-top:10px;clear:both}.ft-deeper>button{all:unset;cursor:pointer;color:#7a5c2e;font:13px/1 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.ft-deeper .body{display:none;margin-top:10px;font-size:15px;color:#4a4234}.ft-deeper.open .body{display:block}
</style>
<div class="ft-stage"><svg id="ft-floorplan-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Georgia, 'Times New Roman', serif">

<script>
const C={"ulam": {"title": "The Porch (Ulam)", "scripture": "1 Kings 6:3", "hebrew": "אוּלָם", "translit": "ulam", "copy": "Before the house proper stood the *ulam*, the porch: \"twenty cubits was the length thereof, according to the breadth of the house; and ten cubits was the breadth thereof before the house\" (1 Kings 6:3) — a 20-cubit-wide, 10-cubit-deep portico spanning the full front of the building. It is the hinge between the open courtyard, where all Israel could come, and the roofed sanctuary only priests would enter.", "deep": "The porch frames the two great bronze pillars (next two hotspots) and announces the building's east-facing orientation: one entered from the east and moved *west*, deeper and higher, toward the Holy of Holies — the architecture itself a journey inward toward the presence of God.", "image": "pillars.png"}, "jachin": {"title": "The Pillar Jachin", "scripture": "1 Kings 7:21", "hebrew": "יָכִין", "translit": "Yakhin", "copy": "At the porch stood two free-standing bronze pillars. \"He set up the right pillar, and called the name thereof Jachin\" (1 Kings 7:21). Each rose eighteen cubits with a five-cubit ornamented capital (1 Kings 7:15–16). They held up no roof — they were monuments, named like proclamations over the threshold of the house.", "deep": "The names read almost as a sentence: *Jachin* — \"He establishes\" — and *Boaz* — \"in him is strength.\" Together they may have declared the LORD's establishing strength over the throne and the temple. *(The \"He establishes / in him is strength\" glosses are the traditional Hebrew etymology — an interpretive reading, not stated by the text.)* Note the 2 Chronicles 3:15 parallel gives the height as thirty-five cubits; the guide renders the eighteen of 1 Kings 7:15 and footnotes the tension.", "image": "pillars.png"}, "boaz": {"title": "The Pillar Boaz", "scripture": "1 Kings 7:21", "hebrew": "בֹּעַז", "translit": "Boaz", "copy": "\"And he set up the left pillar, and called the name thereof Boaz\" (1 Kings 7:21) — the northern twin of Jachin, identical in scale, flanking the entrance so that everyone who approached the house passed between the two great named pillars.", "deep": "See `jachin` for the paired-name reading. The pillars' bronze, like the sea and the lavers, came from the work of Hiram of Tyre (1 Kings 7:13–14) — the Phoenician alliance that supplied the craftsmanship for Solomon's bronze.", "image": "pillars.png"}, "hekhal": {"title": "The Holy Place (Hekhal)", "scripture": "1 Kings 6:17, 29", "hebrew": "הֵיכָל", "translit": "hekhal", "copy": "Past the porch lay the *hekhal*, the Holy Place — \"forty cubits long\" (1 Kings 6:17), the largest room, walled in cedar and overlaid with gold. Here stood the golden lampstands, the tables, and the altar of incense; only priests entered, to tend the light and the bread and to burn incense before the inner veil.", "deep": "Its walls were a garden in gold: \"he carved all the walls of the house round about with carved figures of cherubims and palm trees and open flowers, within and without\" (1 Kings 6:29). The Eden imagery is deliberate — to step inside was to re-enter the garden, the cherubim no longer barring the way but woven into the walls. *(On the furnishings — ten lampstands, the tables, the incense altar — the verified count is **ten** candlesticks and **ten** tables, 2 Chr 4:7–8; see the Furnishings section A4.)*", "image": "holyplace.png"}, "olive-doors": {"title": "The Olive-Wood Doors / Veil", "scripture": "1 Kings 6:31–32; 2 Chronicles 3:14", "hebrew": "דֶּלֶת · פָּרֹכֶת", "translit": "delet · paroketh", "copy": "The innermost room was closed off by \"doors of olive tree… and he carved upon them carvings of cherubims and palm trees and open flowers, and overlaid them with gold\" (1 Kings 6:31–32). The same boundary that the Tabernacle marked with a woven veil, the Temple marked with carved, gold-overlaid olive-wood doors.", "deep": "The sources describe the partition two ways: **1 Kings 6:31–32 gives olive-wood doors; 2 Chronicles 3:14 gives a veil** \"of blue, and purple, and crimson, and fine linen.\" The guide presents both rather than flattening them — likely a door *and* a veil, as in later temple tradition. Either way, it is the threshold only the high priest crossed, and only once a year.", "image": "veil.png"}, "devir": {"title": "The Holy of Holies (Devir) & the Ark", "scripture": "1 Kings 6:19–20; 8:6", "hebrew": "דְּבִיר · אֲרוֹן הַבְּרִית", "translit": "devir · aron ha-berit", "copy": "At the far west stood the *devir*, the Holy of Holies — \"twenty cubits in length, and twenty cubits in breadth, and twenty cubits in the height thereof: and he overlaid it with pure gold\" (1 Kings 6:20). A perfect cube of gold, prepared \"to set there the ark of the covenant of the LORD\" (6:19). No light, no window — the room where the LORD had said He would dwell in \"thick darkness\" (1 Kings 8:12).", "deep": "The cube is significant: the later New Jerusalem is likewise measured as a perfect cube (Revelation 21:16), a shape signaling completed, perfect holiness — the place where heaven and earth meet. The Holy of Holies is the architectural heart toward which the whole east-to-west journey of the building ascends.\n\n**The Ark of the Covenant.** Into the *devir* \"the priests brought in the ark of the covenant of the LORD unto his place… even under the wings of the cherubims\" (1 Kings 8:6). By Solomon's day it held only the two stone tablets (1 Kings 8:9) — the covenant itself, resting at the center of the house, beneath the wings, in the dark. The ark's placement completes the building's logic: every dimension, every gold-clad wall, every cherub points inward to *this* — the covenant at the heart of the dwelling. On what the ark no longer contained (the manna and Aaron's rod) and the theology of that absence, see the **Dedication section (A6)**.", "image": "holyofholies.png"}, "cherubim": {"title": "The Two Cherubim", "scripture": "1 Kings 6:23, 27–28", "hebrew": "כְּרוּבִים", "translit": "keruvim", "copy": "Within the *devir* stood \"two cherubims of olive tree, each ten cubits high\" (1 Kings 6:23), overlaid with gold (6:28). They were enormous: \"the wing of the one touched the one wall, and the wing of the other cherub touched the other wall; and their wings touched one another in the midst of the house\" (6:27) — four wings spanning the full twenty-cubit width.", "deep": "The cherubim formed the throne-seat of the invisible LORD, who is enthroned \"between the cherubims\" (cf. 1 Samuel 4:4; Psalm 80:1). The same beings who guarded Eden's gate (Genesis 3:24) here overshadow the mercy seat — guardianship transformed into nearness.\n\n**Why this form? [Reconstruction]** Scripture never describes the cherubim's shape, so any depiction is reconstruction. This guide draws on **Ezekiel's** vision, where the living creatures — whom Ezekiel explicitly names \"cherubims\" (Ezekiel 10:20) — carry four faces: \"the face of a man… the face of a lion… the face of an ox… the face of an eagle\" (Ezekiel 1:10). The Assyrian winged guardian (*lamassu*) fuses that same set — human head, lion/ox body, eagle wings — into a single figure, reaching into the very Ancient Near Eastern vocabulary Ezekiel's own vision speaks rather than borrowing from outside it. *(The Devir held two sets of cherubim — Solomon's giant olive-wood pair, 1 Kings 6:23–28, and the smaller mercy-seat cherubim already on the ark, Exodus 25:18–20.)*", "image": "cherub.png"}, "molten-sea": {"title": "The Molten Sea", "scripture": "1 Kings 7:23–26", "hebrew": "יָם", "translit": "yam", "copy": "In the courtyard stood the \"molten sea, ten cubits from the one brim to the other… his height was five cubits: and a line of thirty cubits did compass it round about\" (1 Kings 7:23). It \"stood upon twelve oxen\" facing outward in four groups of three (7:25), and \"contained two thousand baths\" (7:26) — roughly eleven to twelve thousand gallons, for the priests' washing.", "deep": "The twelve oxen face the four compass directions — three to each — a figure of all Israel gathered around the place of cleansing. Note the capacity discrepancy: 1 Kings 7:26 gives **2,000 baths**, 2 Chronicles 4:5 gives **3,000**; the guide renders one and footnotes the other. For the Latter-day Saint connection to washings and anointings (D&C 124:38–39), see the Dedication section (A6).", "image": "sea.png"}, "brazen-altar": {"title": "The Altar of Burnt Offering", "scripture": "2 Chronicles 4:1; 1 Kings 8:64", "hebrew": "מִזְבֵּחַ", "translit": "mizbeach", "copy": "Dominating the courtyard before the porch stood the bronze altar of burnt offering — \"twenty cubits the length thereof, and twenty cubits the breadth thereof, and ten cubits the height thereof\" (2 Chronicles 4:1). It was so large that at the dedication Solomon also had to hallow \"the middle of the court\" to handle the offerings (1 Kings 8:64).", "deep": "The altar is the first thing encountered on entering the court and the last station before the holy building — sacrifice as the gateway to approach. Its placement in the visitor's path makes the theological point spatial: there is no coming near without atonement. *(1 Kings 7 omits the altar's dimensions; the 20×20×10 figures come from the 2 Chronicles 4:1 parallel — a [BIBLICAL] cross-source, flagged.)*", "image": "altar.png"}, "lavers": {"title": "The Ten Lavers", "scripture": "1 Kings 7:38–39", "hebrew": "כִּיּוֹר", "translit": "kiyyor", "copy": "Flanking the court were \"ten lavers of brass: one laver contained forty baths: and every laver was four cubits\" (1 Kings 7:38), set on wheeled bases — \"five bases on the right side of the house, and five on the left\" (7:39). Where the great sea served the priests, the ten lavers were for rinsing the offerings.", "deep": "Sea and lavers together make the courtyard a place of water and washing before the house of fire and gold — a graded approach from cleansing to consecration to presence.", "image": "laver.png"}, "side-chambers": {"title": "The Side Chambers", "scripture": "1 Kings 6:5–6", "hebrew": "צֵלָע", "translit": "tsela", "copy": "Around three sides of the house ran a structure of chambers: \"against the wall of the house he built chambers round about… both of the temple and of the oracle\" (1 Kings 6:5) — three stories of rooms hugging the north and south walls, widening floor by floor on rebated ledges so no beams pierced the sanctuary wall (6:6).", "deep": "These chambers stored temple treasure and supplies and housed the work of the priests — the practical machinery that let the sacred center function. They also visually thickened the building, setting the gold-clad core apart within an outer shell.", "image": "chambers.png"}, "approach-steps": {"title": "The Approach (Steps)", "scripture": "2 Chronicles 9:11; cf. Ezekiel 40:22, 26", "hebrew": "מְסִלּוֹת", "translit": "mesillot", "copy": "The house sat on a raised platform, higher than the courtyard, so worshippers *went up* to it — 2 Chronicles 9:11 records that Solomon made “terraces” (*mesillot*) of algum wood “to the house of the LORD.” The number isn’t recorded for Solomon’s Temple; this guide shows **seven** as a reverent reconstruction.", "deep": "By later tradition the steps became holy ground for worship itself: the **Shir HaMaalot** — the fifteen “Songs of Ascents” (Psalms 120–134) — are linked in rabbinic memory to the fifteen steps the Levites ascended as they sang on the feast days (Mishnah Middot 2:5; b. Sukkah 51b): worship literally *rising* toward the house of God.", "image": ""}, "ark": {"title": "The Ark of the Covenant", "scripture": "1 Kings 8:6–9", "hebrew": "אֲרוֹן הַבְּרִית", "translit": "aron ha-berit", "copy": "At the center of the Devir, beneath the wings of the cherubim, rested the ark: “the priests brought in the ark of the covenant of the LORD unto his place… even under the wings of the cherubims” (1 Kings 8:6), which “covered the ark and the staves thereof above” (8:7). By Solomon’s day it held only “the two tables of stone” (8:9).", "deep": "The ark was the one furnishing carried over from the Tabernacle into the Temple — the covenant itself, at rest in the dark at the heart of the house. On what it no longer contained — the manna and Aaron’s rod — see the **Dedication (A6)**.", "image": "ark.png"}, "incense-altar": {"title": "The Altar of Incense", "scripture": "1 Kings 6:22; 7:48", "hebrew": "מִזְבַּח הַקְּטֹרֶת", "translit": "mizbeach ha-qetoret", "copy": "Directly before the veil stood the golden altar of incense — “the whole altar that was by the oracle he overlaid with gold” (1 Kings 6:22); “the altar of gold” (7:48). Cedar overlaid with gold, it stood at the threshold of the Holy of Holies, where incense rose morning and evening.", "deep": "Its place *before the oracle* set the rising smoke at the very door of God’s presence — a figure of prayer ascending: “Let my prayer be set forth before thee as incense” (Psalm 141:2); in heaven the incense rises “with the prayers of all saints” (Revelation 8:3–4).", "image": "incense.png"}, "tables": {"title": "The Tables of Shewbread", "scripture": "1 Kings 7:48; 2 Chronicles 4:8", "hebrew": "שֻׁלְחָן", "translit": "shulchan", "copy": "Solomon made “the table of gold, whereupon the shewbread was” (1 Kings 7:48) — and ten tables in all, “five on the right side, and five on the left” (2 Chronicles 4:8). Where the Tabernacle had a single table on the north, the Temple multiplied them; on them the bread of the Presence was set in order before the LORD continually.", "deep": "The bread of the Presence — “twelve cakes… in two rows, six on a row, upon the pure table before the LORD” (Leviticus 24:5–6) — was renewed every sabbath “by an everlasting covenant” (24:8): Israel, tribe by tribe, kept before God’s face in the holy place.", "image": "table.png"}, "lampstands": {"title": "The Golden Lampstands", "scripture": "1 Kings 7:49; 2 Chronicles 4:7", "hebrew": "מְנוֹרוֹת", "translit": "menorot", "copy": "Solomon made “the candlesticks of pure gold, five on the right side, and five on the left, before the oracle” (1 Kings 7:49) — ten golden lampstands (2 Chronicles 4:7), with “the flowers, and the lamps, and the tongs of gold.” Where the Tabernacle held a single seven-branched menorah, the Temple filled the Holy Place with light.", "deep": "The lampstands burned continually before the inner veil — the only light in the windowless Holy Place. Light, bread, and incense together made the room a place of perpetual ministry before the LORD; the seven-branched form recalls the tree of life and creation’s completeness (cf. Exodus 25:31–40).", "image": "menorah.png"}, "courtyard": {"title": "The Courts", "scripture": "1 Kings 6:36; 7:12; 2 Chronicles 4:9", "hebrew": "חָצֵר", "translit": "chatzer", "copy": "The whole house stood within walled courts. Solomon “built the inner court with three rows of hewed stone, and a row of cedar beams” (1 Kings 6:36) — and beyond it “the great court round about” (1 Kings 7:12). 2 Chronicles 4:9 names them the **court of the priests** and the **great court**, with “doors for the court… overlaid… with brass.” A brass-overlaid gate on the east opened the way in.", "deep": "The courts graded the approach to God by holiness: all Israel could gather in the **great court**, but only the priests entered the **inner court** nearest the house — nearness to the LORD ordered and guarded, not casual. At the dedication the bronze altar proved too small, so Solomon *“hallow[ed] the middle of the court that was before the house of the LORD”* to receive the multitude of offerings (1 Kings 8:64).\n\n**Where were the gates? [Reconstruction]** Scripture records only that the great-court doors were **overlaid with brass** (2 Chronicles 4:9) and that the house faced **east**, so the principal approach came from the east — it never fixes the gates’ number or position for Solomon’s courts. The six-chambered gatehouse shown here follows the monumental city-gates of Solomon’s own building program at **Hazor, Megiddo, and Gezer** (1 Kings 9:15); a fuller east/north/south scheme would follow **Ezekiel’s** visionary temple (Ezekiel 40:6, 20, 24 — notably with no west gate). Both are shown as reconstruction, not as detail the text gives.", "image": "courtyard.png"}};
function ftmd(s){return s.split(/\n\n+/).map(p=>'<p>'+p.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')+'</p>').join('');}
const ftTip=document.getElementById('ft-tip'),ftPanel=document.getElementById('ft-panel');
document.querySelectorAll('.ft-hit').forEach(h=>{
 h.addEventListener('mouseenter',()=>{ftTip.textContent=h.dataset.title;ftTip.style.opacity=1;});
 h.addEventListener('mousemove',e=>{ftTip.style.left=e.clientX+'px';ftTip.style.top=e.clientY+'px';});
 h.addEventListener('mouseleave',()=>ftTip.style.opacity=0);
 h.addEventListener('click',()=>ftOpen(h.dataset.region));});
function ftOpen(id){const d=C[id];if(!d)return;ftTip.style.opacity=0;
 const body=(d.image?'<img class="ft-panel-img" src="/images/culture/first-temple/props/'+d.image+'" alt="">':'')
  +'<p class="eyebrow">Solomon\'s Temple</p><h2>'+d.title+'</h2>'
  +(d.hebrew?'<p class="heb"><em>'+d.translit+'</em> ('+d.hebrew+')</p>':'')
  +(d.scripture?'<span class="scrip">'+d.scripture+'</span>':'')+ftmd(d.copy)
  +(d.deep?'<div class="ft-deeper"><button onclick="this.parentNode.classList.toggle(\'open\')">▸ Go deeper</button><div class="body">'+ftmd(d.deep)+'</div></div>':'');
 ftPanel.innerHTML='<div class="handle"></div><div class="inner"><button class="x" onclick="ftClose()">×</button>'+body+'</div>';
 ftPanel.classList.add('on');ftPanel.scrollTop=0;}
function ftClose(){ftPanel.classList.remove('on');}
document.addEventListener('click',e=>{if(ftPanel.classList.contains('on')&&!e.target.closest('#ft-panel')&&!e.target.closest('.ft-hit'))ftClose();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')ftClose();});
</script>
